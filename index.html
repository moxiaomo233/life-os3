<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FDE3EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🌷 显化人生 · 生活工作台</title>
<style>
:root{
  --cream:#FFF9F4;
  --pink:#F5A8BC;
  --pink-l:#FDE3EA;
  --pink-xl:#FEF1F5;
  --purple:#B79CE0;
  --purple-l:#EDE4FA;
  --purple-xl:#F7F2FD;
  --text:#5C4B51;
  --muted:#A8949E;
  --red:#E8798A;
  --green:#7FBF9A;
  --gold:#E8B86D;
  --card:#FFFFFF;
  --shadow:0 4px 16px rgba(215,160,180,.14);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--cream);color:var(--text);
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  min-height:100vh;
}
#topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(120deg,var(--pink-l),var(--purple-l));
  border-radius:0 0 20px 20px;
}
#topTitle{font-size:1.1rem;font-weight:700}
.icon-btn{border:none;background:rgba(255,255,255,.6);width:34px;height:34px;border-radius:50%;font-size:1rem}
#view{padding:14px 14px 20px;max-width:560px;margin:0 auto}

/* ---- bottom nav ---- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:#fff;box-shadow:0 -4px 20px rgba(215,160,180,.18);
  padding-bottom:env(safe-area-inset-bottom);
  border-radius:20px 20px 0 0;
}
#tabbar button{
  flex:1;border:none;background:none;padding:8px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:.68rem;color:var(--muted);
}
#tabbar button .ti{font-size:1.25rem;filter:grayscale(.6);opacity:.75}
#tabbar button.on{color:var(--purple);font-weight:600}
#tabbar button.on .ti{filter:none;opacity:1;transform:scale(1.1)}

/* ---- cards ---- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card.pinkbg{background:linear-gradient(135deg,var(--pink-xl),var(--purple-xl))}
.h2{font-size:1rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.h2 .sub{font-size:.75rem;color:var(--muted);font-weight:400}
.muted{color:var(--muted);font-size:.78rem}
.big{font-size:1.4rem;font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}
.red{color:var(--red)}.green{color:var(--green)}.purple{color:var(--purple)}.pink{color:var(--pink)}

/* ---- buttons/inputs ---- */
.btn{
  border:none;background:var(--purple-l);color:var(--text);
  padding:9px 14px;border-radius:14px;font-size:.85rem;font-weight:600;
}
.btn-p{background:linear-gradient(120deg,var(--pink),var(--purple));color:#fff}
.btn-sm{padding:5px 10px;font-size:.75rem;border-radius:10px}
.btn-ghost{background:none;border:1.5px dashed var(--pink);color:var(--pink)}
.btn-full{width:100%;padding:12px;font-size:.95rem}
.input,.sel,.ta{
  width:100%;border:1.5px solid #F3DDE5;border-radius:12px;
  padding:9px 12px;font-size:.9rem;background:#FFFDFB;color:var(--text);outline:none;
  font-family:inherit;
}
.input:focus,.sel:focus,.ta:focus{border-color:var(--purple)}
.ta{min-height:64px;resize:vertical}
label.fl{display:block;font-size:.75rem;color:var(--muted);margin:10px 0 4px}

/* ---- progress ---- */
.prog{height:10px;background:var(--pink-xl);border-radius:6px;overflow:hidden}
.prog>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .4s}
.prog.green>i{background:linear-gradient(90deg,#9AD8B5,#7FBF9A)}

/* ---- chips/tags ---- */
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;background:var(--purple-xl);color:var(--purple);margin:2px}
.chip.on{background:var(--purple);color:#fff}
.chip.pink{background:var(--pink-xl);color:var(--pink)}
.chip.pink.on{background:var(--pink);color:#fff}
.tag-hot{background:#FFE3E3;color:#E8798A}
.tag-bad{background:#EFEFEF;color:#999}

/* ---- list items ---- */
.li{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px dashed #F5E3EA;
}
.li:last-child{border-bottom:none}
.li .emoji{font-size:1.3rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--pink-xl);border-radius:12px;flex-shrink:0}
.li.late{background:#FFF3F4;border-radius:12px;padding:10px 8px;margin:2px -4px}
.li.late .name{color:var(--red)}
.li .name{font-weight:600;font-size:.9rem}
.li .desc{font-size:.72rem;color:var(--muted);margin-top:2px}
.li.done-item .name{color:var(--muted);text-decoration:line-through}

/* checkbox */
.ck{
  width:26px;height:26px;border-radius:50%;border:2px solid #EBCFDA;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:#fff;font-size:.85rem;color:transparent;
}
.ck.on{background:linear-gradient(120deg,var(--pink),var(--purple));border-color:transparent;color:#fff}

/* ---- date bar / subtabs ---- */
.datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
.datebar b{font-size:.95rem}
.datebar button{border:none;background:#fff;box-shadow:var(--shadow);width:30px;height:30px;border-radius:50%;color:var(--purple);font-size:.9rem}
.subtabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.subtabs button{flex:1;border:none;background:none;padding:8px 0;border-radius:11px;font-size:.85rem;color:var(--muted);font-weight:600}
.subtabs button.on{background:linear-gradient(120deg,var(--pink-l),var(--purple-l));color:var(--text)}

/* ---- water cups ---- */
.cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cup{font-size:1.4rem;filter:grayscale(1);opacity:.35;border:none;background:none;transition:.2s}
.cup.full{filter:none;opacity:1}

/* ---- mood ---- */
.moods{display:flex;justify-content:space-between;margin-top:6px}
.moods button{border:none;background:none;font-size:1.5rem;opacity:.4;transition:.2s;padding:4px}
.moods button.on{opacity:1;transform:scale(1.3)}

/* ---- belief card ---- */
.belief{
  background:linear-gradient(135deg,#F9D5E0,#D9C6F2);
  border-radius:var(--radius);padding:18px 16px;text-align:center;
  font-size:.95rem;font-weight:600;line-height:1.7;color:#6B4A5E;
  box-shadow:var(--shadow);margin-bottom:12px;
}
.belief .bt{font-size:.7rem;opacity:.65;letter-spacing:2px;margin-bottom:6px;font-weight:400}

/* affirmation */
.affirm{font-size:.88rem;line-height:1.6;color:#8A6B95;background:var(--purple-xl);border-radius:14px;padding:12px;position:relative}
.affirm button{position:absolute;right:8px;bottom:6px;border:none;background:none;font-size:.72rem;color:var(--purple)}

/* ---- heatmap ---- */
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:#F4E9EE;flex-shrink:0}
.heat i.l1{background:#F8D3DE}.heat i.l2{background:#F1AFC5}.heat i.l3{background:#D69ED6}.heat i.l4{background:#B77FD9}

/* ---- charts ---- */
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---- modal / sheet ---- */
#modalMask,#sheetMask{
  display:none;position:fixed;inset:0;background:rgba(90,60,80,.35);z-index:40;
}
#modalBox{
  display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(100% - 40px);max-width:420px;max-height:80vh;overflow-y:auto;
  background:#fff;border-radius:20px;padding:18px;z-index:50;
}
#moreSheet{
  position:fixed;left:0;right:0;bottom:-100%;z-index:45;background:#fff;
  border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transition:bottom .25s;
}
#moreSheet.open{bottom:0}
.sheet-handle{width:40px;height:4px;background:#EBD7E0;border-radius:2px;margin:4px auto 14px}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sheet-grid button{
  border:none;background:var(--pink-xl);border-radius:16px;padding:12px 4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--text);font-weight:600;
}
.sheet-grid button span{font-size:1.5rem}
.sheet-row{display:flex;gap:10px}
.sheet-row .btn{flex:1}
.sheet-tip{font-size:.7rem;color:var(--muted);margin-top:12px;line-height:1.6}

/* toast */
#toast{
  display:none;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:rgba(92,75,81,.92);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:.82rem;z-index:60;max-width:80%;text-align:center;
}

/* misc */
.streak{font-size:.7rem;color:var(--gold);font-weight:600}
.stat-num{font-size:1.25rem;font-weight:700}
.stat-box{background:var(--pink-xl);border-radius:14px;padding:10px;text-align:center}
.stat-box .muted{font-size:.68rem}
.del-x{border:none;background:none;color:#D9B8C6;font-size:1rem;padding:4px}
.summary-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #F5E3EA;font-size:.85rem}
.summary-line:last-child{border-bottom:none}
.summary-line span:last-child{font-weight:600}
.auto-box{background:#F3F0F8;border:1px solid #E6DEF4;border-radius:10px;padding:10px 12px;font-size:.92rem;font-weight:600;color:var(--purple);margin:4px 0}
.auto-box .muted{font-weight:400}
.sup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.sup-card{background:var(--purple-xl);border:1px solid #EADCF1;border-radius:12px;padding:11px 4px;text-align:center;font-size:.82rem;font-weight:600;color:var(--purple);cursor:pointer;font-family:inherit;line-height:1.2}
.sup-card.on{background:linear-gradient(120deg,var(--pink),var(--purple));color:#fff;border-color:transparent}
.sup-card .st{display:block;font-size:1.05rem;margin-top:3px}
.sup-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sup-sum .pill{background:var(--purple-xl);border-radius:20px;padding:6px 12px;font-size:.78rem;color:var(--purple)}
.sup-sum .pill b{color:var(--purple);margin:0 3px}
.warn-banner{background:#FFF0F1;color:var(--red);border-radius:12px;padding:9px 12px;font-size:.78rem;margin-bottom:10px}
.pri-高{color:var(--red);font-weight:700}
.pri-中{color:var(--gold)}
.pri-低{color:var(--muted)}
.time-lbl{font-size:.78rem;color:var(--purple);font-weight:700;width:44px;flex-shrink:0}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:.8rem}

/* ---- 成长显化模块 ---- */
.vision-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vision-card{background:#fff;border:1px solid #F3E2EA;border-radius:14px;padding:14px 10px;text-align:center;position:relative}
.vision-card .v-emoji{font-size:2rem}
.vision-card .v-text{font-size:.82rem;margin-top:6px;color:var(--text);line-height:1.4}
.vision-card .del-x{position:absolute;top:4px;right:6px}
.ach-grid{display:flex;flex-direction:column;gap:10px}
.ach-card{background:linear-gradient(135deg,#FCE7EF,#E9DEF7);border-radius:14px;padding:12px 14px;border-left:4px solid var(--pink);position:relative}
.ach-card .a-date{font-size:.7rem;color:var(--muted)}
.ach-card .a-text{font-size:.92rem;margin-top:3px;color:var(--text);font-weight:600;line-height:1.4}

</style>
</head>
<body>
<header id="topbar">
  <div id="topTitle">🌷 显化人生</div>
  <button class="icon-btn" onclick="openMore()">✨</button>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button data-v="home" onclick="showView('home')"><span class="ti">🏠</span><span>首页</span></button>
  <button data-v="habits" onclick="showView('habits')"><span class="ti">✅</span><span>打卡</span></button>

</nav>

<div id="sheetMask" onclick="closeMore()"></div>
<div id="moreSheet">
  <div class="sheet-handle"></div>

    <button onclick="closeMore();OneStop.date=TODAY();showView('onestop')"><span>📝</span>记录今天</button>
  </div>
  <div class="sheet-row">

</div>

<div id="modalMask" onclick="closeModal()"></div>
<div id="modalBox"></div>
<div id="toast"></div>

function $(s){return document.querySelector(s)}
function uid(){return Math.random().toString(36).slice(2,9)}
function pad2(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function P(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function TODAY(){return fmt(new Date())}
function addD(s,n){var d=P(s);d.setDate(d.getDate()+n);return fmt(d)}
var DOW=['日','一','二','三','四','五','六'];
function dispD(s){var d=P(s);return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+DOW[d.getDay()]}
function weekStart(s){var d=P(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fmt(d)}
function weekDays(s){var st=weekStart(s),a=[];for(var i=0;i<7;i++)a.push(addD(st,i));return a}
function mKey(s){return s.slice(0,7)}
function monthDays(mk){var p=mk.split('-'),n=new Date(+p[0],+p[1],0).getDate(),a=[];for(var i=1;i<=n;i++)a.push(mk+'-'+pad2(i));return a}
function prevMK(mk){var p=mk.split('-'),y=+p[0],m=+p[1];return m===1?(y-1)+'-12':y+'-'+pad2(m-1)}
function nextMK(mk){var p=mk.split('-'),y=+p[0],m=+p[1];return m===12?(y+1)+'-01':y+'-'+pad2(m+1)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fm(n){n=Math.round((+n||0)*100)/100;return n.toLocaleString('zh-CN')}
function daysDiff(a,b){return Math.round((P(b)-P(a))/86400000)}
function isLateNow(){return new Date().getHours()>=21}
function sum(arr){return arr.reduce(function(a,b){return a+(+b||0)},0)}

function importData(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.habits||!d.hlog)throw 0;
      DB=d;loadFix();save();rerender();toast('📥 数据导入成功');closeMore();

  };
  r.readAsText(f);inp.value='';

function ringSVG(pct,size,label,sub){

    '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F5A8BC"/><stop offset="100%" stop-color="#B79CE0"/></linearGradient></defs>'+
    '<text x="'+cx+'" y="'+(cx-2)+'" text-anchor="middle" font-size="'+(size*.19)+'" font-weight="700" fill="#5C4B51">'+label+'</text>'+
    '<text x="'+cx+'" y="'+(cx+size*.16)+'" text-anchor="middle" font-size="'+(size*.1)+'" fill="#A8949E">'+sub+'</text>'+
    '</svg>';
}
/* items:[{l,v,v2}]  两个系列时传 c2/lg */
function barChart(items,opt){
  opt=opt||{};
  var H=opt.h||150,padB=26,padT=14,two=items.some(function(i){return i.v2!==undefined});
  var max=1;items.forEach(function(i){max=Math.max(max,+i.v||0,+i.v2||0)});
  var n=items.length,bw=two?9:Math.min(26,Math.max(8,220/n)),gap=two?4:0;
  var slot=Math.max(two?(bw*2+gap+8):bw+8,18);
  var W=Math.max(300,n*slot+20);
  var s='<div class="chart-wrap"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  var every=n>16?Math.ceil(n/10):1;
  items.forEach(function(it,i){
    var x0=10+i*slot+slot/2;
    var h1=(+it.v||0)/max*(H-padB-padT);
    if(two){
      var h2=(+it.v2||0)/max*(H-padB-padT);
      s+='<rect x="'+(x0-bw-gap/2)+'" y="'+(H-padB-h1)+'" width="'+bw+'" height="'+Math.max(h1,1)+'" rx="3" fill="'+(opt.c1||'#F5A8BC')+'"/>';
      s+='<rect x="'+(x0+gap/2)+'" y="'+(H-padB-h2)+'" width="'+bw+'" height="'+Math.max(h2,1)+'" rx="3" fill="'+(opt.c2||'#B79CE0')+'"/>';
    }else{
      s+='<rect x="'+(x0-bw/2)+'" y="'+(H-padB-h1)+'" width="'+bw+'" height="'+Math.max(h1,1)+'" rx="3" fill="'+(opt.c1||PAL[1])+'"/>';

    }

  });
  s+='</svg></div>';

}
function donutChart(items){
  items=items.filter(function(i){return +i.v>0});
  var total=sum(items.map(function(i){return i.v}));
  if(!total)return '<div class="empty">暂无数据</div>';
  var size=130,r=48,c=2*Math.PI*r,acc=0,cx=size/2;
  var s='<div class="row" style="justify-content:center;gap:16px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  items.forEach(function(it,i){
    var frac=it.v/total;
    s+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+PAL[i%PAL.length]+'" stroke-width="22" stroke-dasharray="'+(frac*c)+' '+c+'" stroke-dashoffset="'+(-acc*c)+'" transform="rotate(-90 '+cx+' '+cx+')"/>';
    acc+=frac;
  });
  s+='</svg><div>';
  items.forEach(function(it,i){
    s+='<div style="font-size:.75rem;margin:3px 0"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+PAL[i%PAL.length]+';margin-right:5px"></i>'+esc(it.l)+' <b>'+Math.round(it.v/total*100)+'%</b> <span class="muted">('+fm(it.v)+')</span></div>';
  });
  s+='</div></div>';
  return s;
}
function lineChart(items,opt){
  opt=opt||{};
  if(!items.some(function(i){return i.v!=null}))return '<div class="empty">暂无数据</div>';
  var H=opt.h||140,W=Math.max(300,items.length*34+20),padB=24,padT=14;
  var vals=items.filter(function(i){return i.v!=null}).map(function(i){return +i.v});
  var max=Math.max.apply(null,vals),min=Math.min.apply(null,vals);
  if(max===min){max+=1;min-=1}
  var pts=[],s='<div class="chart-wrap"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  var every=items.length>14?Math.ceil(items.length/8):1;
  items.forEach(function(it,i){
    var x=16+i*((W-32)/Math.max(items.length-1,1));
    if(it.v!=null){
      var y=padT+(1-((+it.v-min)/(max-min)))*(H-padB-padT);
      pts.push([x,y,it.v]);
    }
    if(i%every===0)s+='<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="#A8949E">'+esc(it.l)+'</text>';
  });
  if(pts.length>1)s+='<polyline points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'" fill="none" stroke="'+(opt.c||'#B79CE0')+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p){
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#fff" stroke="'+(opt.c||'#B79CE0')+'" stroke-width="2"/>';
    s+='<text x="'+p[0]+'" y="'+(p[1]-7)+'" text-anchor="middle" font-size="9" fill="#8A6B95">'+p[2]+'</text>';
  });
  s+='</svg></div>';
  return s;
}
/* days: [{date,lvl 0-4}] 按周排列 */
function heatmap(days){
  var cols={},order=[];
  days.forEach(function(d){
    var ws=weekStart(d.date);
    if(!cols[ws]){cols[ws]=new Array(7).fill(null);order.push(ws)}
    cols[ws][(P(d.date).getDay()+6)%7]=d.lvl;
  });
  var s='<div class="heat">';
  order.forEach(function(ws){
    s+='<div class="col">';
    cols[ws].forEach(function(l){s+='<i class="'+(l?('l'+l):'')+'" style="'+(l===null?'opacity:0':'')+'"></i>'});
    s+='</div>';
  });
  s+='</div>';
  return s;
}

/* 多段环形图（用于时间管理四大类）：items:[{l,v,color}] */
function groupRing(items,size){
  items=items.filter(function(i){return +i.v>0});
  var total=sum(items.map(function(i){return i.v}));
  var cx=size/2;
  if(!total)return '<div class="muted" style="text-align:center;padding:18px 0">今天还没记录时间</div>';
  var r=(size-14)/2,c=2*Math.PI*r,acc=0;
  var s='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  items.forEach(function(it){
    var frac=it.v/total;
    s+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+it.color+'" stroke-width="12" stroke-dasharray="'+(frac*c)+' '+c+'" stroke-dashoffset="'+(-acc*c)+'" transform="rotate(-90 '+cx+' '+cx+')"/>';
    acc+=frac;
  });
  s+='</svg>';

}

function boot(){
  loadDB();save();
  showView('home');

    // 跨零点自动刷新（打卡/计划自动进入新的一天，历史保留）

}

<script>
'use strict';
/* ================= 习惯打卡 ================= */
var Habits={date:TODAY(),tab:'list'};

function hlogOf(date){return DB.hlog[date]||{}}
function hrec(date,hid){var l=DB.hlog[date];return l&&l[hid]?l[hid]:{}}
function setHrec(date,hid,rec){
  if(!DB.hlog[date])DB.hlog[date]={};
  DB.hlog[date][hid]=Object.assign({},DB.hlog[date][hid]||{},rec);
  save();
}
function habitDone(h,rec){
  if(!rec)return false;
  if(h.type==='water')return (+rec.val||0)>=(h.target||DB.settings.waterGoal);
  return !!rec.done;
}
function habitProgress(date){
  var done=0;
  DB.habits.forEach(function(h){if(habitDone(h,hrec(date,h.id)))done++});
  return {done:done,total:DB.habits.length};
}
function waterOf(date){return +(hrec(date,'water').val||0)}
function addWater(ml,date){
  date=date||TODAY();
  var v=Math.max(0,waterOf(date)+(+ml||0));
  setHrec(date,'water',{val:v,done:v>=DB.settings.waterGoal});
  rerender();
  if(v>=DB.settings.waterGoal)toast('💧 今日喝水目标达成！身体棒棒！');
}
function streakOf(hid){
  var h=DB.habits.find(function(x){return x.id===hid});if(!h)return 0;
  var d=TODAY(),n=0;
  if(!habitDone(h,hrec(d,hid)))d=addD(d,-1); // 今天没完成从昨天算
  while(habitDone(h,hrec(d,hid))){n++;d=addD(d,-1);if(n>3650)break}
  return n;
}
function longestStreak(hid){
  var h=DB.habits.find(function(x){return x.id===hid});if(!h)return 0;
  var dates=Object.keys(DB.hlog).filter(function(d){return habitDone(h,DB.hlog[d][hid])}).sort();
  var best=0,cur=0,prev=null;
  dates.forEach(function(d){
    cur=(prev&&daysDiff(prev,d)===1)?cur+1:1;
    if(cur>best)best=cur;prev=d;
  });
  return best;
}
function totalDaysOf(hid){
  var h=DB.habits.find(function(x){return x.id===hid});if(!h)return 0;
  return Object.keys(DB.hlog).filter(function(d){return habitDone(h,DB.hlog[d][hid])}).length;
}
function dayRate(date){
  var p=habitProgress(date);
  return p.total?p.done/p.total:0;
}

VIEWS.habits=function(){
  var d=Habits.date,late=isLateNow()&&d===TODAY();
  var html='<div class="subtabs">'+
    '<button class="'+(Habits.tab==='list'?'on':'')+'" onclick="Habits.tab=\'list\';rerender()">今日打卡</button>'+
    '<button class="'+(Habits.tab==='stat'?'on':'')+'" onclick="Habits.tab=\'stat\';rerender()">习惯统计</button></div>';
  if(Habits.tab==='list'){
    html+='<div class="datebar"><button onclick="Habits.date=addD(Habits.date,-1);rerender()">‹</button><b>'+dispD(d)+(d===TODAY()?' · 今天':'')+'</b><button onclick="Habits.date=addD(Habits.date,1);rerender()">›</button></div>';
    var p=habitProgress(d);
    html+='<div class="card pinkbg center">'+ringSVG(p.total?p.done/p.total:0,110,p.done+'/'+p.total,'已完成')+'</div>';
    if(late&&p.done<p.total)html+='<div class="warn-banner">🔔 已经晚上9点啦，还有 '+(p.total-p.done)+' 个习惯没完成，标红的要加油哦～</div>';
    html+='<div class="card">';
    DB.habits.forEach(function(h){
      var rec=hrec(d,h.id),done=habitDone(h,rec);
      var isLateItem=late&&!done;
      var st=streakOf(h.id),tot=totalDaysOf(h.id);
      html+='<div class="li '+(isLateItem?'late':'')+(done?' done-item':'')+'">';
      html+='<div class="emoji">'+h.emoji+'</div><div class="grow">';
      html+='<div class="name">'+esc(h.name)+(h.remind?' <span class="muted" style="font-size:.65rem">⏰'+esc(h.remind)+'</span>':'')+'</div>';
      html+='<div class="desc">'+(st>0?'<span class="streak">已坚持'+st+'天 🔥</span> · ':'')+'累计'+tot+'天';
      if(h.type==='water')html+=' · 已喝 <b>'+waterOf(d)+'</b>/'+(h.target||2000)+'ml';
      if(h.type==='text'&&rec.txt)html+=' · '+esc(rec.txt);
      html+='</div>';
      if(h.type==='water'){
        html+='<div class="prog mt8" style="max-width:180px"><i style="width:'+Math.min(100,waterOf(d)/(h.target||2000)*100)+'%"></i></div>';
        html+='<div class="mt8"><button class="btn btn-sm" onclick="addWater(100,\''+d+'\')">+100</button> <button class="btn btn-sm" onclick="addWater(250,\''+d+'\')">+250</button> <button class="btn btn-sm" onclick="addWater(500,\''+d+'\')">+500</button> <button class="btn btn-sm btn-ghost" onclick="Habits.customWater(\''+d+'\')">自定义</button></div>';
      }
      html+='</div>';
      html+='<div class="ck '+(done?'on':'')+'" onclick="Habits.toggle(\''+d+'\',\''+h.id+'\')">✓</div>';
      html+='<button class="del-x" onclick="Habits.edit(\''+h.id+'\')">✎</button>';
      html+='</div>';
    });
    html+='</div>';
    html+='<button class="btn btn-ghost btn-full" onclick="Habits.edit()">＋ 新增习惯</button>';
  }else{
    html+=Habits.statHTML();
  }
  $('#view').innerHTML=html;
};

Habits.toggle=function(date,hid){
  var h=DB.habits.find(function(x){return x.id===hid});
  var rec=hrec(date,hid);
  if(h.type==='water'){
    if(waterOf(date)>=(h.target||2000)){setHrec(date,'water',{val:0,done:false});rerender()}
    else Habits.customWater(date);
    return;
  }
  if(h.type==='text'&&!rec.done){
    modal('<div class="h2">'+h.emoji+' '+esc(h.name)+'</div>'+
      '<input class="input" id="htxt" placeholder="'+esc(h.ph||'记录一下')+'" value="'+esc(rec.txt||'')+'">'+
      '<div class="row mt12"><button class="btn grow" onclick="closeModal()">取消</button>'+
      '<button class="btn btn-p grow" onclick="Habits.saveTxt(\''+date+'\',\''+hid+'\')">完成打卡 ✓</button></div>');
    setTimeout(function(){$('#htxt').focus()},100);
    return;
  }
  setHrec(date,hid,{done:!rec.done});
  if(!rec.done)toast('✅ 打卡成功！'+(streakOf(hid)>1?'已连续'+streakOf(hid)+'天 🔥':'棒棒的！'));
  rerender();
};

    '<label class="fl">习惯名称</label><input class="input" id="hn" value="'+esc(h?h.name:'')+'" placeholder="如：晨间拉伸">'+

  var days=Habits.statPeriod==='week'?weekDays(TODAY()):monthDays(mKey(TODAY()));
  var html='<div class="card"><div class="h2">📊 习惯完成率 <span>'+
    '<button class="chip '+(Habits.statPeriod==='week'?'on':'')+'" onclick="Habits.statPeriod=\'week\';rerender()">本周</button>'+
    '<button class="chip '+(Habits.statPeriod==='month'?'on':'')+'" onclick="Habits.statPeriod=\'month\';rerender()">本月</button></span></div>';
  var items=DB.habits.map(function(h){
    var done=days.filter(function(d){return d<=TODAY()&&habitDone(h,hrec(d,h.id))}).length;
    var passed=days.filter(function(d){return d<=TODAY()}).length||1;
    return {l:h.emoji,v:Math.round(done/passed*100),name:h.name,done:done,passed:passed};
  });
  html+=barChart(items,{showVal:true,pct:true,c1:'#B79CE0',h:150});
  html+='<div class="mt8">';
  items.forEach(function(it){
    html+='<div class="summary-line"><span>'+it.l+' '+esc(it.name)+'</span><span>'+it.done+'/'+it.passed+'天 · '+it.v+'%</span></div>';
  });
  html+='</div></div>';
  // 最长连续记录
  var best={n:'',v:0,e:''};
  DB.habits.forEach(function(h){var v=longestStreak(h.id);if(v>best.v)best={n:h.name,v:v,e:h.emoji}});
  html+='<div class="card"><div class="h2">🏆 最长连续打卡</div>';
  if(best.v>0){
    html+='<div class="center"><div class="big">'+best.e+' '+esc(best.n)+'</div><div class="streak" style="font-size:1rem">最长连续 '+best.v+' 天 🔥</div></div>';
    html+='<div class="mt8">';
    DB.habits.forEach(function(h){
      var v=longestStreak(h.id);
      if(v>0)html+='<div class="summary-line"><span>'+h.emoji+' '+esc(h.name)+'</span><span>最长连续 '+v+' 天</span></div>';
    });
    html+='</div>';
  }else html+='<div class="empty">开始打卡后这里会出现你的记录 ✨</div>';
  html+='</div>';
  // 打卡日历热力图
  var hDays=[],start=addD(TODAY(),-104);
  for(var d=start;d<=TODAY();d=addD(d,1)){
    var r=dayRate(d),lvl=0;
    if(r>0)lvl=1;if(r>=0.4)lvl=2;if(r>=0.7)lvl=3;if(r>=1)lvl=4;
    hDays.push({date:d,lvl:lvl});
  }
  html+='<div class="card"><div class="h2">🗓️ 打卡日历 <span class="sub">最近15周 · 越亮完成越多</span></div>'+heatmap(hDays)+'</div>';
  setTimeout(function(){var el=document.querySelector('.heat');if(el)el.scrollLeft=el.scrollWidth},50);
  return html;
};

</script>
<script>
'use strict';
/* ================= 计划管理 ================= */
var Plans={date:TODAY(),tab:'day',week:TODAY(),month:mKey(TODAY())};

function occursOn(tpl,date){
  if(tpl.rep==='daily')return true;
  if(tpl.rep==='week')return (tpl.days||[]).indexOf(P(date).getDay())>=0;
  return false;
}
function tasksOf(date){
  var skip=DB.plans.skip[date]||[];
  var list=DB.plans.tpl.filter(function(t){return occursOn(t,date)&&skip.indexOf(t.id)<0})
    .map(function(t){return {id:t.id,t:t.t,n:t.n,pri:t.pri,tpl:true}});
  (DB.plans.extra[date]||[]).forEach(function(t){list.push({id:t.id,t:t.t,n:t.n,pri:t.pri,tpl:false})});
  var pw={'高':0,'中':1,'低':2};
  list.sort(function(a,b){return (pw[a.pri]-pw[b.pri])||(a.t<b.t?-1:1)});
  return list;
}
function planProgress(date){
  var list=tasksOf(date),dn=DB.plans.done[date]||{};
  return {done:list.filter(function(t){return dn[t.id]}).length,total:list.length};
}

VIEWS.plans=function(){
  var html='<div class="subtabs">'+
    '<button class="'+(Plans.tab==='day'?'on':'')+'" onclick="Plans.tab=\'day\';rerender()">每日</button>'+
    '<button class="'+(Plans.tab==='week'?'on':'')+'" onclick="Plans.tab=\'week\';rerender()">每周</button>'+
    '<button class="'+(Plans.tab==='month'?'on':'')+'" onclick="Plans.tab=\'month\';rerender()">每月</button></div>';
  if(Plans.tab==='day')html+=Plans.dayHTML();
  else if(Plans.tab==='week')html+=Plans.weekHTML();
  else html+=Plans.monthHTML();
  $('#view').innerHTML=html;
};

/* ---- 每日计划 ---- */
Plans.dayHTML=function(){
  var d=Plans.date,list=tasksOf(d),dn=DB.plans.done[d]||{};
  var p=planProgress(d),late=isLateNow()&&d===TODAY();
  var html='<div class="datebar"><button onclick="Plans.date=addD(Plans.date,-1);rerender()">‹</button><b>'+dispD(d)+(d===TODAY()?' · 今天':'')+'</b><button onclick="Plans.date=addD(Plans.date,1);rerender()">›</button></div>';
  html+='<div class="card pinkbg"><div class="row"><div class="grow"><b>今日进度</b><div class="muted mt8">完成 '+p.done+' / '+p.total+' 项</div></div><div style="width:120px"><div class="prog"><i style="width:'+(p.total?p.done/p.total*100:0)+'%"></i></div></div></div></div>';
  if(late&&p.done<p.total)html+='<div class="warn-banner">🔔 还有 '+(p.total-p.done)+' 项计划未完成哦～</div>';
  html+='<div class="card">';
  if(!list.length)html+='<div class="empty">今天还没有安排，点下方新增 ✨</div>';
  list.forEach(function(t){
    var done=!!dn[t.id],lateItem=late&&!done;
    html+='<div class="li '+(lateItem?'late':'')+(done?' done-item':'')+'">';
    html+='<div class="ck '+(done?'on':'')+'" onclick="Plans.toggle(\''+d+'\',\''+t.id+'\')">✓</div>';
    html+='<div class="time-lbl">'+esc(t.t)+'</div>';
    html+='<div class="grow"><div class="name">'+esc(t.n)+'</div><div class="desc"><span class="pri-'+t.pri+'">'+(t.pri==='高'?'🔴 高优先':t.pri==='中'?'🟡 中':'⚪ 低')+'</span>'+(t.tpl?' · 重复':' · 临时任务')+'</div></div>';
    html+='<button class="del-x" onclick="Plans.editTask(\''+d+'\',\''+t.id+'\','+(t.tpl?'true':'false')+')">✎</button>';
    html+='</div>';
  });
  html+='</div>';
  html+='<button class="btn btn-p btn-full" onclick="Plans.editTask(\''+d+'\',\'\',false)">＋ 新增安排 / 临时任务</button>';
  return html;
};
Plans.toggle=function(date,id){
  if(!DB.plans.done[date])DB.plans.done[date]={};
  DB.plans.done[date][id]=!DB.plans.done[date][id];
  save();rerender();
};
Plans.editTask=function(date,id,isTpl){
  var t=null;
  if(id){
    t=isTpl?DB.plans.tpl.find(function(x){return x.id===id}):(DB.plans.extra[date]||[]).find(function(x){return x.id===id});
  }
  var rep=t&&t.tpl!==false?(t.rep||'once'):'once';
  if(t&&isTpl)rep=t.rep;if(t&&!isTpl)rep='once';
  var days=(t&&t.days)||[];
  var html='<div class="h2">'+(t?'编辑安排':'新增安排')+'</div>'+
    '<label class="fl">时间</label><input class="input" id="pt" value="'+esc(t?t.t:'12:00')+'" placeholder="如 15:00">'+
    '<label class="fl">内容</label><input class="input" id="pn" value="'+esc(t?t.n:'')+'" placeholder="如：下午3点给小王补课">'+
    '<label class="fl">优先级</label><div id="priRow">';
  ['高','中','低'].forEach(function(pr){
    html+='<button class="chip pink'+((t?t.pri:'中')===pr?' on':'')+'" data-pri="'+pr+'" onclick="Plans.pickPri(this)">'+pr+'</button>';
  });
  html+='</div><label class="fl">重复</label><div id="repRow">';
  [['once','仅当天'],['daily','每天'],['week','每周指定']].forEach(function(r){
    html+='<button class="chip'+(rep===r[0]?' on':'')+'" data-rep="'+r[0]+'" onclick="Plans.pickRep(this)">'+r[1]+'</button>';
  });
  html+='</div><div id="dayRow" style="display:'+(rep==='week'?'block':'none')+';margin-top:6px">';
  DOW.forEach(function(w,i){
    html+='<button class="chip'+(days.indexOf(i)>=0?' on':'')+'" data-day="'+i+'" onclick="this.classList.toggle(\'on\')">周'+w+'</button>';
  });
  html+='</div><div class="row mt12">'+
    (t?'<button class="btn" style="color:var(--red)" onclick="Plans.delTask(\''+date+'\',\''+id+'\','+(isTpl?'true':'false')+')">删除</button>':'')+
    '<button class="btn grow" onclick="closeModal()">取消</button>'+
    '<button class="btn btn-p grow" onclick="Plans.saveTask(\''+date+'\',\''+(id||'')+'\','+(isTpl?'true':'false')+')">保存</button></div>';
  modal(html);
};
Plans.pickPri=function(el){document.querySelectorAll('#priRow .chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on')};
Plans.pickRep=function(el){
  document.querySelectorAll('#repRow .chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on');
  $('#dayRow').style.display=el.dataset.rep==='week'?'block':'none';
};
Plans.saveTask=function(date,id,isTpl){
  var t=$('#pt').value.trim()||'12:00',n=$('#pn').value.trim();
  if(!n){toast('请填写内容');return}
  var pri=(document.querySelector('#priRow .chip.on')||{}).dataset;pri=pri?pri.pri:'中';
  var rep=(document.querySelector('#repRow .chip.on')||{}).dataset;rep=rep?rep.rep:'once';
  var days=[];document.querySelectorAll('#dayRow .chip.on').forEach(function(c){days.push(+c.dataset.day)});
  // 删旧
  if(id){
    if(isTpl)DB.plans.tpl=DB.plans.tpl.filter(function(x){return x.id!==id});
    else if(DB.plans.extra[date])DB.plans.extra[date]=DB.plans.extra[date].filter(function(x){return x.id!==id});
  }
  var nid=id||uid();
  if(rep==='once'){
    if(!DB.plans.extra[date])DB.plans.extra[date]=[];
    DB.plans.extra[date].push({id:nid,t:t,n:n,pri:pri});
  }else{
    DB.plans.tpl.push({id:nid,t:t,n:n,pri:pri,rep:rep,days:days});
  }
  save();closeModal();rerender();toast('已保存 ✨');
};
Plans.delTask=function(date,id,isTpl){
  if(isTpl){
    var only=confirm('点「确定」仅删除今天这一条；点「取消」后可再选是否删除所有重复日。');
    if(only){
      if(!DB.plans.skip[date])DB.plans.skip[date]=[];
      DB.plans.skip[date].push(id);
    }else{
      if(!confirm('要删除这条安排的所有重复日吗？'))return;
      DB.plans.tpl=DB.plans.tpl.filter(function(x){return x.id!==id});
    }
  }else{
    DB.plans.extra[date]=(DB.plans.extra[date]||[]).filter(function(x){return x.id!==id});
  }
  save();closeModal();rerender();
};

/* ---- 每周目标 ---- */
Plans.weekHTML=function(){
  var ws=weekStart(Plans.week),we=addD(ws,6);
  var goals=DB.goalsW[ws]||[];
  var done=goals.filter(function(g){return g.done}).length;
  var html='<div class="datebar"><button onclick="Plans.week=addD(Plans.week,-7);rerender()">‹</button><b>'+dispD(ws)+' ~ '+dispD(we)+'</b><button onclick="Plans.week=addD(Plans.week,7);rerender()">›</button></div>';
  html+='<div class="card pinkbg center"><div class="big">'+done+' / '+goals.length+'</div><div class="muted">本周目标完成率 '+(goals.length?Math.round(done/goals.length*100)+'%':'--')+'</div><div class="prog mt8"><i style="width:'+(goals.length?done/goals.length*100:0)+'%"></i></div></div>';
  html+='<div class="card"><div class="h2">🎯 本周目标 <span class="sub">最多10个</span></div>';
  if(!goals.length)html+='<div class="empty">周一给自己定几个小目标吧 ✨<br>比如：教练课排满15节 / 直播5天</div>';
  goals.forEach(function(g,i){
    html+='<div class="li'+(g.done?' done-item':'')+'"><div class="ck '+(g.done?'on':'')+'" onclick="Plans.toggleWG(\''+ws+'\','+i+')">✓</div><div class="grow name">'+esc(g.text)+'</div><button class="del-x" onclick="Plans.delWG(\''+ws+'\','+i+')">✕</button></div>';
  });
  html+='</div>';
  if(goals.length<10)html+='<div class="card"><div class="row"><input class="input grow" id="wgInp" placeholder="输入本周目标…"><button class="btn btn-p" onclick="Plans.addWG(\''+ws+'\')">添加</button></div></div>';
  return html;
};
Plans.addWG=function(ws){
  var v=$('#wgInp').value.trim();if(!v)return;
  if(!DB.goalsW[ws])DB.goalsW[ws]=[];
  DB.goalsW[ws].push({text:v,done:false});
  save();rerender();
};
Plans.toggleWG=function(ws,i){DB.goalsW[ws][i].done=!DB.goalsW[ws][i].done;save();rerender()};
Plans.delWG=function(ws,i){DB.goalsW[ws].splice(i,1);save();rerender()};

/* ---- 每月目标 ---- */
var MST=['⚪ 未开始','🟡 进行中','✅ 已完成'];
Plans.monthHTML=function(){
  var mk=Plans.month,goals=DB.goalsM[mk]||[];
  var done=goals.filter(function(g){return g.st===2}).length;
  var html='<div class="datebar"><button onclick="Plans.month=prevMK(Plans.month);rerender()">‹</button><b>'+mk.replace('-','年')+'月</b><button onclick="Plans.month=nextMK(Plans.month);rerender()">›</button></div>';
  html+='<div class="card pinkbg center"><div class="big">'+done+' / '+goals.length+'</div><div class="muted">本月目标已完成</div></div>';
  html+='<div class="card"><div class="h2">🌙 本月目标 <span class="sub">点状态可切换 · 最多10个</span></div>';
  if(!goals.length)html+='<div class="empty">月初给自己定几个目标吧 ✨</div>';
  goals.forEach(function(g,i){
    html+='<div class="li"><button class="chip'+(g.st===2?' on':'')+'" onclick="Plans.cycleMG(\''+mk+'\','+i+')" style="min-width:84px">'+MST[g.st||0]+'</button><div class="grow name'+(g.st===2?' muted':'')+'">'+esc(g.text)+'</div><button class="del-x" onclick="Plans.delMG(\''+mk+'\','+i+')">✕</button></div>';
  });
  html+='</div>';
  if(goals.length<10)html+='<div class="card"><div class="row"><input class="input grow" id="mgInp" placeholder="输入本月目标…"><button class="btn btn-p" onclick="Plans.addMG(\''+mk+'\')">添加</button></div></div>';
  return html;
};
Plans.addMG=function(mk){
  var v=$('#mgInp').value.trim();if(!v)return;
  if(!DB.goalsM[mk])DB.goalsM[mk]=[];
  DB.goalsM[mk].push({text:v,st:0});
  save();rerender();
};
Plans.cycleMG=function(mk,i){DB.goalsM[mk][i].st=((DB.goalsM[mk][i].st||0)+1)%3;save();rerender()};
Plans.delMG=function(mk,i){DB.goalsM[mk].splice(i,1);save();rerender()};

</script>
<script>
'use strict';
/* ================= 学习管理 ================= */
var Study={date:TODAY(),tab:'day'};
/* 你主修：塔罗 / 健身康复 / 普拉提 / 英语 / 显化 */
var STUDY_CATS=['塔罗','健身康复','普拉提','英语','显化','健身解剖学','自媒体运营','其他'];

function studyOf(date){return DB.study[date]||[]}
function studyMins(dates){
  var t=0;
  dates.forEach(function(d){
    var tm=timeStudyMins(d);
    if(tm>0)t+=tm;                                   /* 优先用时间管理模块的「学习」时长 */
    else (studyOf(d)||[]).forEach(function(e){t+=+e.min||0}); /* 旧数据回退 */
  });
  return t;
}
function fmtMin(m){return m>=60?(Math.floor(m/60)+'小时'+(m%60?m%60+'分':'')):(m+'分钟')}
/* 连续学习天数（含今天，按有学习记录计） */
function studyStreak(date){
  var n=0,d=date;
  while(studyOf(d).length>0){n++;d=addD(d,-1)}
  return n;
}

VIEWS.study=function(){
  var html='<div class="subtabs">'+
    '<button class="'+(Study.tab==='day'?'on':'')+'" onclick="Study.tab=\'day\';rerender()">今日学习</button>'+
    '<button class="'+(Study.tab==='stat'?'on':'')+'" onclick="Study.tab=\'stat\';rerender()">学习统计</button>'+
    '<button class="'+(Study.tab==='tarot'?'on':'')+'" onclick="Study.tab=\'tarot\';rerender()">塔罗一牌</button>'+
    '<button class="'+(Study.tab==='store'?'on':'')+'" onclick="Study.tab=\'store\';rerender()">积累本</button></div>';
  html+= Study.tab==='day'?Study.dayHTML(): Study.tab==='stat'?Study.statHTML(): Study.tab==='tarot'?Study.tarotHTML():Study.storeHTML();
  $('#view').innerHTML=html;
};

Study.dayHTML=function(){
  var d=Study.date,list=studyOf(d);
  var tm=timeStudyMins(d);
  var html='<div class="datebar"><button onclick="Study.date=addD(Study.date,-1);rerender()">‹</button><b>'+dispD(d)+(d===TODAY()?' · 今天':'')+'</b><button onclick="Study.date=addD(Study.date,1);rerender()">›</button></div>';
  html+='<div class="card"><div class="h2">📖 记录学习</div>'+
    '<label class="fl">今天学了什么</label><input class="input" id="sWhat" placeholder="如：塔罗-恋人牌的牌义">'+
    '<label class="fl">学习时长（自动来自「时间管理」）</label>'+
    '<div class="row" style="background:var(--pink-xl);border-radius:12px;padding:10px;margin-bottom:8px">'+
      '<div class="grow"><b style="font-size:1rem">'+ (tm>0?fmtMin(tm):'—') +'</b><div class="muted" style="font-size:.72rem">'+(tm>0?'已自动同步自时间管理':'尚未在时间管理记录「学习」')+'</div></div>'+
      (tm>0?'':'<button class="btn btn-sm" onclick="showView(\'time\')">去记 ›</button>')+
    '</div>'+
    '<label class="fl">学习心得（一两句话）</label><input class="input" id="sNote" placeholder="有什么收获？">'+
    '<label class="fl">分类</label><div id="sCatRow">';
  STUDY_CATS.forEach(function(c,i){
    html+='<button class="chip'+(i===0?' on':'')+'" data-cat="'+c+'" onclick="Study.pickCat(this)">'+c+'</button>';
  });
  html+='</div>'+
    '<label class="fl">掌握度（1-5 ⭐，记下你吸收了多少）</label>'+
    '<div id="sMasterRow" class="row" style="gap:6px;flex-wrap:wrap">';
  for(var mi=1;mi<=5;mi++)html+='<button class="chip" data-m="'+mi+'" onclick="Study.pickMaster(this)">'+mi+'⭐</button>';
  html+='</div>'+
    '<button class="btn btn-p btn-full mt12" onclick="Study.add(\''+d+'\')">保存记录 ✓</button></div>';

  html+='<div class="card"><div class="h2">当日记录 <span class="sub">共'+fmtMin(studyMins([d]))+'</span></div>';
  if(!list.length)html+='<div class="empty">还没有记录，学一点是一点 ✨</div>';
  list.forEach(function(e,i){
    var ms=e.master?(' · 掌握'+e.master+'⭐'):'';
    html+='<div class="li"><div class="emoji">📚</div><div class="grow"><div class="name">'+esc(e.what)+'</div><div class="desc">'+esc(e.cat)+' · '+fmtMin(+e.min||0)+ms+(e.note?' · '+esc(e.note):'')+'</div></div><button class="del-x" onclick="Study.del(\''+d+'\','+i+')">✕</button></div>';
  });
  html+='</div>';
  return html;
};
Study.pickCat=function(el){document.querySelectorAll('#sCatRow .chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on')};
Study.pickMaster=function(el){document.querySelectorAll('#sMasterRow .chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on')};
Study.add=function(d){
  var what=$('#sWhat').value.trim();
  if(!what){toast('先写写今天学了什么吧');return}
  var cat=(document.querySelector('#sCatRow .chip.on')||{}).dataset;cat=cat?cat.cat:'其他';
  var mEl=document.querySelector('#sMasterRow .chip.on');var master=mEl?+mEl.dataset.m:0;
  if(!DB.study[d])DB.study[d]=[];
  DB.study[d].push({what:what,min:timeStudyMins(d),note:$('#sNote').value.trim(),cat:cat,master:master});
  save();rerender();toast('📖 已记录，你又进步了一点！');
};
Study.del=function(d,i){DB.study[d].splice(i,1);save();rerender()};

Study.tarotHTML=function(){
  var d=Study.date,r=DB.tarot[d]||{};
  var html='<div class="datebar"><button onclick="Study.date=addD(Study.date,-1);rerender()">‹</button><b>'+dispD(d)+(d===TODAY()?' · 今天':'')+'</b><button onclick="Study.date=addD(Study.date,1);rerender()">›</button></div>';
  html+='<div class="card pinkbg"><div class="h2">🔮 塔罗 · 每日一牌</div>'+
    '<div class="muted" style="margin-bottom:8px">每天抽一张牌，记下感悟——既是学习积累，也是直播/小红书的素材 💜</div>'+

<script>

  if(!DB.money.log[date])DB.money.log[date]={inc:{coach:0,live:0,other:0},exp:[]};
  return DB.money.log[date];

function dayMoney(date){
  var l=DB.money.log[date];

  var inc=0,exp=0;

<script>
'use strict';
/* ================= 身体管理 ================= */
var Body={date:TODAY(),tab:'day'};

/* 补剂清单（身体专属，每日勾选，周/月自动汇总次数） */
var SUPPS=['钙片','维C','维E','维B','鱼油','镁','肌酸','BCCA','蛋白粉'];

function bday(date){
  if(!DB.body.day[date])DB.body.day[date]={meds:[],sleep:{},bowel:0};
  return DB.body.day[date];
}
function sleepHours(bed,wake){
  if(!bed||!wake)return null;
  var b=bed.split(':'),w=wake.split(':');
  if(b.length<2||w.length<2)return null;
  var mins=(+w[0]*60+ +w[1])-(+b[0]*60+ +b[1]);
  if(mins<=0)mins+=1440;
  return Math.round(mins/6)/10;
}
function sleepOf(date){
  var s=(DB.body.day[date]||{}).sleep||{};
  return {h:sleepHours(s.bed,s.wake),q:s.q||'',bed:s.bed||'',wake:s.wake||'',note:s.note||''};
}
function periodPredict(){
  var ps=DB.body.period.slice().sort(function(a,b){return a.start<b.start?-1:1});
  if(!ps.length)return null;
  var cycle=28;
  if(ps.length>=2){
    var ds=[];
    for(var i=1;i<ps.length;i++)ds.push(daysDiff(ps[i-1].start,ps[i].start));
    cycle=Math.round(sum(ds)/ds.length);
  }
  var next=addD(ps[ps.length-1].start,cycle);
  return {next:next,cycle:cycle,days:daysDiff(TODAY(),next),last:ps[ps.length-1]};
}
// 当前所处生理阶段（月经/卵泡/排卵/黄体）+ 注意事项 + 运动推荐
function periodPhase(){
  var ps=DB.body.period.slice().sort(function(a,b){return a.start<b.start?-1:1});
  if(!ps.length)return null;
  var cycle=28;
  if(ps.length>=2){var ds=[];for(var i=1;i<ps.length;i++)ds.push(daysDiff(ps[i-1].start,ps[i].start));cycle=Math.round(sum(ds)/ds.length)}
  var last=ps[ps.length-1],since=daysDiff(last.start,TODAY());
  if(since<0)since=0;
  var dayIn=((since%cycle)+cycle)%cycle;
  var info;
  if(dayIn<5)info={name:'月经期',note:'身体正在排毒修复，体力偏低。注意保暖、多休息，少吃生冷，情绪波动很正常，对自己温柔一点。',ex:'推荐：散步、拉伸、阴瑜伽/修复瑜伽，避免高强度训练和倒立。'};
  else if(dayIn<14)info={name:'卵泡期',note:'精力回升、状态变好，是办大事的好时机，皮肤也常更透亮。',ex:'推荐：可以上强度——力量训练、普拉提、有氧都合适，体能和信心都在上升。'};
  else if(dayIn<17)info={name:'排卵期',note:'雌激素峰值，精力最旺、魅力最强，但易水肿或情绪小波动，注意补水。',ex:'推荐：HIIT、舞蹈、球类等高强度运动正合适，把握好状态高峰。'};
  else info={name:'黄体期',note:'孕激素上升，可能疲惫、想吃甜食、情绪低落（经前综合征），补充镁和钙，别勉强自己。',ex:'推荐：中等强度——普拉提、快走、瑜伽；临近经期逐渐减量。'};
  return {name:info.name,note:info.note,ex:info.ex,dayIn:dayIn+1,cycle:cycle};
}

/* ---- 每日 ---- */

  }else html+='<div class="empty">今天还没记睡眠，去「记录今天」填一下吧</div>';

Body.toggleSup=function(d,name){
  var x=bday(d);
  if(!x.sup)x.sup={};
  x.sup[name]=!x.sup[name];
  save();rerender();
};
// 统计若干天里每种补剂被勾选的天数
Body.supCount=function(days){
  var cnt={};
  SUPPS.forEach(function(s){cnt[s]=0});
  days.forEach(function(d){
    var sp=(DB.body.day[d]||{}).sup||{};
    SUPPS.forEach(function(s){if(sp[s])cnt[s]++});
  });
  return cnt;
};
Body.supCardHTML=function(title,days){
  var cnt=Body.supCount(days);
  var html='<div class="card"><div class="h2">'+title+'</div><div class="sup-sum">';
  SUPPS.forEach(function(s){
    html+='<span class="pill">'+s+' <b>'+cnt[s]+'</b> 次</span>';
  });
  html+='</div></div>';

};
Body.setSleep=function(d,k,v){
  var s=bday(d);if(!s.sleep)s.sleep={};
  s.sleep[k]=v;save();rerender();
};
Body.addPeriod=function(){
  var st=prompt('开始日期（如 '+TODAY()+'）',TODAY());

  var en=prompt('结束日期（还没结束可留空）','');

};
Body.listPeriod=function(){

Body.delPeriod=function(i){DB.body.period.splice(i,1);save();closeModal();rerender()};

/* ---- 每周 ---- */
Body.weekSel=TODAY();
Body.weekHTML=function(){
  var ws=weekStart(Body.weekSel),w=DB.body.week[ws]||{};
  var html='<div class="datebar"><button onclick="Body.weekSel=addD(Body.weekSel,-7);rerender()">‹</button><b>'+dispD(ws)+' 这一周</b><button onclick="Body.weekSel=addD(Body.weekSel,7);rerender()">›</button></div>';

  var exMin=Math.round(sum(_wd.map(function(d){return sum((DB.time.log[d]||[]).filter(function(e){return e.cat==='运动健身'}).map(function(e){return (+e.hrs||0)*60}))})));

    '<div class="grid2">'+
    '<div><label class="fl">体重（kg）</label><input class="input" type="number" step="0.1" value="'+(w.weight||'')+'" onchange="Body.setW(\''+ws+'\',\'weight\',this.value)"></div>'+
    '<div><label class="fl">体脂率（%）</label><input class="input" type="number" step="0.1" value="'+(w.fat||'')+'" onchange="Body.setW(\''+ws+'\',\'fat\',this.value)"></div>'+
    '<div><label class="fl">胸围（cm）</label><input class="input" type="number" step="0.1" value="'+(w.chest||'')+'" onchange="Body.setW(\''+ws+'\',\'chest\',this.value)"></div>'+
    '<div><label class="fl">腰围（cm）</label><input class="input" type="number" step="0.1" value="'+(w.waist||'')+'" onchange="Body.setW(\''+ws+'\',\'waist\',this.value)"></div>'+
    '<div><label class="fl">臀围（cm）</label><input class="input" type="number" step="0.1" value="'+(w.hip||'')+'" onchange="Body.setW(\''+ws+'\',\'hip\',this.value)"></div>'+
    '<div><label class="fl">运动次数</label><div class="auto-box">'+wods.length+' 次 · 自动统计</div></div>'+
    '</div>'+
    '<label class="fl">运动总时长（分钟）</label><div class="auto-box">'+exMin+' 分钟 · 自动统计（时间管理·运动健身）</div>'+
    '<label class="fl">腰臀比</label><div class="auto-box">'+(w.waist&&w.hip?Math.round(w.waist/w.hip*100)/100:'—')+' <span class="muted">（腰÷臀，健康约 0.7-0.85）</span></div>'+
    '<label class="fl">身体状态备注</label><textarea class="ta" onchange="Body.setW(\''+ws+'\',\'note\',this.value)">'+esc(w.note||'')+'</textarea></div>';
  // 本周睡眠 & 大便总结（自动汇总自每日记录）
  var wDays=weekDays(ws);
  var sDays=wDays.filter(function(d){return sleepOf(d).h!=null});
  var avgSleep=sDays.length?Math.round(sum(sDays.map(function(d){return sleepOf(d).h}))/sDays.length*10)/10:null;
  var qc={好:0,一般:0,差:0};
  sDays.forEach(function(d){var q=sleepOf(d).q;if(q)qc[q]++});
  var bq=sum(wDays.map(function(d){return (+((DB.body.day[d]||{}).bowel||0))}));
  var bwAvg=Math.round(bq/7*10)/10;
  html+='<div class="card"><div class="h2">💤 本周睡眠 & 🚽 大便总结 <span class="sub">自动汇总自每日记录</span></div>'+
    '<div class="auto-box">😴 平均睡眠 <b>'+(avgSleep!=null?avgSleep+' 小时':'—')+'</b>'+(sDays.length?(' · 本周 '+sDays.length+' 天有记录 · 质量 好'+qc['好']+'/一般'+qc['一般']+'/差'+qc['差']):' · 本周还没记睡眠')+'</div>'+
    '<div class="auto-box mt8">🚽 大便 <b>'+bq+' 次</b> · 日均 '+bwAvg+' 次</div>'+
    '<div class="muted mt8">数据来自「每日记录」里的睡眠/大便，填了这里会自动更新～</div></div>';
  // 本周/本月补剂打卡汇总（自动统计自每日勾选）
  var mk=TODAY().slice(0,7);
  var mDays=weekDays? monthDays(mk):[];
  html+=Body.supCardHTML('💊 本周补剂打卡（自动统计）',wDays);
  html+=Body.supCardHTML('💊 本月补剂打卡（'+mk+' · 自动统计）',mDays);
  // 本周运动打卡回顾（联动习惯）
  html+='<div class="card"><div class="h2">🏋️ 本周运动打卡（联动习惯）</div>';
  if(wods.length){
    wods.forEach(function(d){
      html+='<div class="summary-line"><span>'+dispD(d)+'</span><span>'+esc(hrec(d,'workout').txt||'✓')+'</span></div>';
    });
  }else html+='<div class="empty">本周还没有运动打卡</div>';
  html+='</div>';
  return html;
};
Body.setW=function(ws,k,v){
  if(!DB.body.week[ws])DB.body.week[ws]={};
  DB.body.week[ws][k]=(k==='note')?v:(v===''?'':+v);
  save();toast('已保存');
};
Body.bowelInc=function(d,delta){var x=bday(d);x.bowel=Math.max(0,(+x.bowel||0)+delta);save();rerender()};
Body.setBowelNote=function(d,v){bday(d).bowelNote=v;save();rerender()};

/* ---- 趋势 ---- */
Body.trendHTML=function(){
  // 最近13周
  var weeks=[];
  for(var i=12;i>=0;i--)weeks.push(weekStart(addD(TODAY(),-7*i)));
  var wItems=weeks.map(function(ws){var w=DB.body.week[ws]||{};return {l:(P(ws).getMonth()+1)+'/'+P(ws).getDate(),v:w.weight!==''&&w.weight!=null?w.weight:null}});
  var html='<div class="card"><div class="h2">📉 体重变化（kg · 近3个月）</div>'+lineChart(wItems,{c:'#B79CE0'})+'</div>';
  var fItems=weeks.map(function(ws){var w=DB.body.week[ws]||{};return {l:(P(ws).getMonth()+1)+'/'+P(ws).getDate(),v:w.fat!==''&&w.fat!=null?w.fat:null}});
  html+='<div class="card"><div class="h2">📉 体脂率变化（%）</div>'+lineChart(fItems,{c:'#F5A8BC'})+'</div>';
  var cItems=weeks.map(function(ws){var w=DB.body.week[ws]||{};return {l:(P(ws).getMonth()+1)+'/'+P(ws).getDate(),v:w.chest!==''&&w.chest!=null?w.chest:null}});
  var waItems=weeks.map(function(ws){var w=DB.body.week[ws]||{};return {l:(P(ws).getMonth()+1)+'/'+P(ws).getDate(),v:w.waist!==''&&w.waist!=null?w.waist:null}});
  var hItems=weeks.map(function(ws){var w=DB.body.week[ws]||{};return {l:(P(ws).getMonth()+1)+'/'+P(ws).getDate(),v:w.hip!==''&&w.hip!=null?w.hip:null}});
  html+='<div class="card"><div class="h2">📐 三围变化（cm · 近3个月）</div>'+
    '<div class="muted" style="margin-bottom:6px">🩷 胸围</div>'+lineChart(cItems,{c:'#F5A8BC'})+
    '<div class="muted mt8" style="margin-bottom:6px">💜 腰围</div>'+lineChart(waItems,{c:'#B79CE0'})+
    '<div class="muted mt8" style="margin-bottom:6px">🩵 臀围</div>'+lineChart(hItems,{c:'#93B8E8'})+'</div>';
  // 本周睡眠
  var wk=weekDays(TODAY());
  var wkS=wk.filter(function(d){return sleepOf(d).h!=null});
  var wkAvg=wkS.length?Math.round(sum(wkS.map(function(d){return sleepOf(d).h}))/wkS.length*10)/10:null;
  var sItems=wk.map(function(d){var s=sleepOf(d);return {l:'周'+DOW[P(d).getDay()],v:s.h||0}});
  html+='<div class="card"><div class="h2">😴 本周睡眠时长（小时）</div>'+
    (wkAvg!=null?'<div class="auto-box">本周平均 <b>'+wkAvg+' 小时</b> · '+wkS.length+' 天有记录</div>':'<div class="muted">本周还没记录睡眠，去「每日记录」填一下吧～</div>')+
    barChart(sItems,{c1:'#93B8E8',showVal:true})+'<div class="mt8">';
  wk.forEach(function(d){
    var s=sleepOf(d);
    if(s.q)html+='<span class="chip">'+'周'+DOW[P(d).getDay()]+' '+(s.q==='好'?'😊':s.q==='一般'?'😐':'😫')+'</span>';
  });
  html+='</div></div>';
  // 每周平均睡眠趋势（近3个月，自动汇总自每日记录）
  var sleepTrend=weeks.map(function(ws){
    var wd=weekDays(ws);
    var sd=wd.filter(function(d){return sleepOf(d).h!=null});
    var avg=sd.length?Math.round(sum(sd.map(function(d){return sleepOf(d).h}))/sd.length*10)/10:null;
    return {l:(P(ws).getMonth()+1)+'/'+P(ws).getDate(), v:avg};
  });
  html+='<div class="card"><div class="h2">😴 每周平均睡眠（小时 · 近3个月）</div>'+lineChart(sleepTrend,{c:'#93B8E8'})+'<div class="muted mt8">哪周睡得好、哪周缺觉，一眼看清～</div></div>';
  return html;
};

<script>
'use strict';
/* ================= 不消费打卡（一年不消费挑战） ================= */
var NoSpend={tab:'home',lt:'buy',form:{emo:'',inten:0,trig:'',res:'hold',exc:false}};
var NS_EMO=['😍心动','😰焦虑','😴无聊','😤压力大','🥺难过','😊开心','🤝社交'];
var NS_RES=[['hold','🙅 忍住了'],['cool','⏳ 进冷静期'],['buy','🛍️ 买了']];
var NS_INV_CATS=['服饰','鞋包','美妆护肤','饰品','家居','数码','书籍','运动装备','其他'];
var NS_COOL=30;

function nsDefault(){

    set:{
      start:'',end:'',excPerMonth:2,
      cats:['服饰','美妆护肤','鞋包','饰品','家居装饰','数码','盲盒手办','奶茶甜品','外卖','图书','课程']
    },
    urge:[],   // {id,date,item,amt,emo,inten,trig,res,why,after,exc}
    buy:[],    // {id,item,reason,budget,deadline,added,status}
    ban:[
      {id:'b1',name:'快时尚服饰',note:'再便宜也不买'},
      {id:'b2',name:'盲盒 / 手办',note:''},
      {id:'b3',name:'奶茶饮料',note:'自带水杯'},
      {id:'b4',name:'限时折扣囤货',note:'囤货=浪费'},
      {id:'b5',name:'美妆囤货',note:'用完再买'},
      {id:'b6',name:'网红小家电',note:''}
    ],
    trig:[
      {id:'t1',name:'直播间',level:'高',strategy:'先退出，加入冷静期30天'},
      {id:'t2',name:'小红书种草',level:'高',strategy:'取关种草号'},
      {id:'t3',name:'和朋友逛街',level:'中',strategy:'提前说好只看不买'},
      {id:'t4',name:'情绪低落',level:'高',strategy:'去运动 / 写日记，不逛购物app'},
      {id:'t5',name:'无聊刷手机',level:'中',strategy:'换成看书 / 拉伸'}
    ],
    inv:[],    // {id,cat,name,qty,idle,value}
    jar:[
      {id:'j1',name:'还贷基金',target:100000,saved:0},
      {id:'j2',name:'留学基金',target:50000,saved:0},
      {id:'j3',name:'大房子首付',target:300000,saved:0}
    ]
  };
}
function NS(){if(!DB.nospend)DB.nospend=nsDefault();return DB.nospend}

/* ---- 统计 ---- */
function nsStats(dates){
  var us=(NS().urge||[]).filter(function(u){return !dates||dates.indexOf(u.date)>=0});
  var o={urge:us.length,hold:0,cool:0,buy:0,saved:0,spent:0};
  us.forEach(function(u){
    if(u.res==='hold'){o.hold++;o.saved+=+u.amt||0}
    else if(u.res==='cool')o.cool++;
    else{o.buy++;o.spent+=+u.amt||0}
  });
  o.rate=o.urge?o.hold/o.urge:0;
  return o;
}
function nsSummary(dates){
  var s=nsStats(dates);
  if(!s.urge)return '—';
  return '冲动'+s.urge+' · 忍住'+s.hold+' · 买了'+s.buy+' · 少花¥'+fm(s.saved);
}
function nsProg(){
  var s=NS().set;
  if(!s.start)return null;
  var total=s.end?daysDiff(s.start,s.end)+1:365;
  var done=s.start>TODAY()?0:Math.min(total,daysDiff(s.start,TODAY())+1);
  return {done:done,total:total,pct:total?Math.min(1,done/total):0};
}
function nsStreak(){
  var s=NS().set,end=(s.end&&s.end<TODAY())?s.end:TODAY();
  if(!s.start||end<s.start)return 0;
  var n=0,d=end,g=0;
  while(g++<3000){
    if(d<s.start)break;
    var bad=(NS().urge||[]).some(function(u){return u.date===d&&u.res==='buy'});
    if(bad)break;
    n++;d=addD(d,-1);
  }
  return n;
}
function nsExcUsed(mk){
  mk=mk||mKey(TODAY());
  return (NS().urge||[]).filter(function(u){return u.res==='buy'&&u.exc&&mKey(u.date)===mk}).length;
}
function nsBadges(){
  var a=nsStats(null),s=nsStreak(),inv=(NS().inv||[]).length;
  return [
    {e:'🌱',n:'第一次忍住',ok:a.hold>=1},
    {e:'🔥',n:'连续3天零破戒',ok:s>=3},
    {e:'⭐',n:'连续7天零破戒',ok:s>=7},
    {e:'💎',n:'连续30天零破戒',ok:s>=30},
    {e:'👑',n:'连续100天零破戒',ok:s>=100},
    {e:'💰',n:'省下1000元',ok:a.saved>=1000},
    {e:'💵',n:'省下5000元',ok:a.saved>=5000},
    {e:'🏆',n:'省下10000元',ok:a.saved>=10000},
    {e:'📦',n:'清点100件物品',ok:inv>=100},
    {e:'🧘',n:'忍住率80%',ok:a.urge>=10&&a.rate>=0.8}
  ];
}
function nsMonths(n){
  var a=[],mk=mKey(TODAY()),m=mk;
  for(var i=0;i<n;i++){a.unshift(m);m=prevMK(m)}
  return a;
}

/* ---- 储蓄罐 ---- */
NoSpend.jarHTML=function(){

NoSpend.addJar=function(){

  if(!v||!v.trim())return;
  var t=prompt('目标金额（元）','10000');
  NS().jar.push({id:uid(),name:v.trim(),target:+t||0,saved:0});save();rerender();toast('🫙 新罐子已建好');
};
NoSpend.jarIn=function(id){
  var j=(NS().jar||[]).find(function(x){return x.id===id});if(!j)return;
  var v=prompt('存多少钱进「'+j.name+'」？（元）','');
  if(v==null)return;
  var n=+v;if(!n||n<=0){toast('请输入金额');return}
  j.saved=(+j.saved||0)+n;save();rerender();toast('🫙 存入 ¥'+fm(n)+'，离目标更近了');
};
NoSpend.jarTarget=function(id){
  var j=(NS().jar||[]).find(function(x){return x.id===id});if(!j)return;
  var v=prompt('「'+j.name+'」的目标金额（元）',j.target);
  if(v!=null&&+v>=0){j.target=+v;save();rerender()}
};

/* ---- 统计 ---- */
NoSpend.statHTML=function(){
  var a=nsStats(null),streak=nsStreak(),bg=nsBadges();
  var ms=nsMonths(6);
  var rateItems=ms.map(function(m){
    var s=nsStats(monthDays(m));

    '<div class="stat-box"><div class="stat-num purple">'+a.urge+'</div><div class="muted">冲动（次）</div></div>'+
    '<div class="stat-box"><div class="stat-num green">'+a.hold+'</div><div class="muted">忍住（次）</div></div>'+
    '<div class="stat-box"><div class="stat-num red">'+a.buy+'</div><div class="muted">买了（次）</div></div></div>'+
    '<div class="summary-line mt8"><span>忍住率</span><span>'+(a.urge?Math.round(a.rate*100):0)+'%</span></div>'+
    '<div class="summary-line"><span>累计少花 / 花掉</span><span>¥'+fm(a.saved)+' / ¥'+fm(a.spent)+'</span></div>'+
    '<div class="summary-line"><span>最长连续零破戒</span><span>'+streak+' 天</span></div></div>';

  html+='<div class="card"><div class="h2">💰 每月少花（近6个月，元）</div>'+barChart(amtItems,{c1:'#B79CE0',showVal:true})+'</div>';
  // 触发源分布
  var byTrig={};(NS().urge||[]).forEach(function(u){var k=u.trig||'未注明';byTrig[k]=(byTrig[k]||0)+1});
  var keys=Object.keys(byTrig);
  if(keys.length)html+='<div class="card"><div class="h2">🎯 冲动触发源分布</div>'+donutChart(keys.map(function(k){return {l:k,v:byTrig[k]}}))+'</div>';
  // 徽章墙
  html+='<div class="card"><div class="h2">🏅 徽章墙</div><div style="display:flex;flex-wrap:wrap;gap:10px">';
  bg.forEach(function(b){
    html+='<div class="center" style="width:76px;padding:8px 2px;border-radius:12px;background:'+(b.ok?'#F3F0F8':'#FAF7F9')+';opacity:'+(b.ok?1:.35)+'">'+
      '<div style="font-size:1.7rem">'+b.e+'</div><div class="muted" style="font-size:.66rem;line-height:1.25">'+b.n+'</div></div>';
  });
  html+='</div></div>';
  return html;
};

/* ---- 通用 ---- */
NoSpend.del=function(kind,id){
  var n=NS();
  if(kind==='urge')n.urge=n.urge.filter(function(x){return x.id!==id});
  else if(kind==='buy')n.buy=n.buy.filter(function(x){return x.id!==id});
  else if(kind==='ban')n.ban=n.ban.filter(function(x){return x.id!==id});
  else if(kind==='trig')n.trig=n.trig.filter(function(x){return x.id!==id});
  else if(kind==='inv')n.inv=n.inv.filter(function(x){return x.id!==id});
  else if(kind==='jar')n.jar=n.jar.filter(function(x){return x.id!==id});
  save();rerender();
};
NoSpend.settings=function(){
  var s=NS().set;
  modal('<div class="h2">⚙️ 挑战规则</div>'+
    '<label class="fl">开始日期</label><input class="input" type="date" id="nsStart" value="'+esc(s.start||'')+'">'+
    '<label class="fl">结束日期（默认一年后）</label><input class="input" type="date" id="nsEnd" value="'+esc(s.end||'')+'">'+
    '<label class="fl">每月例外次数（计划内破例额度）</label><input class="input" type="number" id="nsExc" value="'+(s.excPerMonth||0)+'">'+
    '<div class="muted mt8">🛡️ 房租、伙食、通勤、工作必需开销不算破戒，不需要记录。</div>'+
    '<div class="row mt12"><button class="btn grow" onclick="closeModal()">取消</button>'+
    '<button class="btn btn-p grow" onclick="NoSpend.saveSet()">保存</button></div>');
};
NoSpend.saveSet=function(){
  var s=NS().set;
  s.start=$('#nsStart').value;
  s.end=$('#nsEnd').value;
  s.excPerMonth=Math.max(0,+$('#nsExc').value||0);
  if(s.start&&!s.end)s.end=addD(s.start,364);
  save();closeModal();rerender();toast('⚙️ 规则已保存，开始了就别停哦');
};

<script>
'use strict';
/* ================= 复盘管理（自动汇总各模块数据） ================= */
var Review={tab:'d',dDate:TODAY(),wDate:TODAY(),mDate:mKey(TODAY())};

function rvD(date){if(!DB.review.d[date])DB.review.d[date]={good:['','',''],best:'',manifest:'',intention:'',tomorrow:''};return DB.review.d[date]}
function rvW(ws){if(!DB.review.w[ws])DB.review.w[ws]={good:['','',''],improve:'',goals:['','','']};return DB.review.w[ws]}
function rvM(mk){if(!DB.review.m[mk])DB.review.m[mk]={harvest:'',thanks:['','',''],goals:['','','']};return DB.review.m[mk]}
var MOOD_GOOD=['🌞','😊','🥰'],MOOD_BAD=['😢','😡'];

/* 时间汇总：跨多日聚合四大类时长 */
function timeAgg(dates){
  var g={work:0,life:0,growth:0,leisure:0};
  dates.forEach(function(d){(DB.time.log[d]||[]).forEach(function(e){g[e.group]=(g[e.group]||0)+(+e.hrs||0)})});
  return {g:g,total:g.work+g.life+g.growth+g.leisure};
}
function timeWorkCats(date){
  var m={};(DB.time.log[date]||[]).forEach(function(e){if(e.group==='work')m[e.cat]=(m[e.cat]||0)+(+e.hrs||0)});
  return m;
}
/* 时间汇总：跨多日聚合四大类时长（用于复盘展示，时间本身在时间管理页记录） */

VIEWS.review=function(){
  var html='<div class="subtabs">'+
    '<button class="'+(Review.tab==='d'?'on':'')+'" onclick="Review.tab=\'d\';rerender()">每日复盘</button>'+
    '<button class="'+(Review.tab==='w'?'on':'')+'" onclick="Review.tab=\'w\';rerender()">每周复盘</button>'+
    '<button class="'+(Review.tab==='m'?'on':'')+'" onclick="Review.tab=\'m\';rerender()">每月复盘</button></div>';
  html+=Review.tab==='d'?Review.dayHTML():Review.tab==='w'?Review.weekHTML():Review.monthHTML();
  $('#view').innerHTML=html;
};

/* ---- 每日复盘 ---- */
Review.dayHTML=function(){
  var d=Review.dDate,r=rvD(d);
  var hp=habitProgress(d),pp=planProgress(d),m=dayMoney(d);
  var sMin=studyMins([d]),sList=studyOf(d);
  var sl=sleepOf(d),mood=DB.mood[d]||'—';
  var html='<div class="datebar"><button onclick="Review.dDate=addD(Review.dDate,-1);rerender()">‹</button><b>'+dispD(d)+(d===TODAY()?' · 今天':'')+'</b><button onclick="Review.dDate=addD(Review.dDate,1);rerender()">›</button></div>';
  html+='<div class="card pinkbg"><div class="h2">✨ 今天的你，做了这么多事</div>'+
    '<div class="summary-line"><span>✅ 习惯完成</span><span>'+hp.done+' / '+hp.total+' 个</span></div>'+
    '<div class="summary-line"><span>🗓️ 计划完成</span><span>'+pp.done+' / '+pp.total+' 个</span></div>'+
    '<div class="summary-line"><span>💰 收入 / 支出 / 结余</span><span class="red">+'+fm(m.inc)+'</span></div>'+
    '<div class="summary-line"><span></span><span>−'+fm(m.exp)+' → 结余 '+fm(m.inc-m.exp)+'</span></div>'+
    '<div class="summary-line"><span>📖 学习</span><span>'+(sMin?fmtMin(sMin):'—')+'</span></div>'+
    (sList.length?'<div class="muted" style="padding:2px 0 6px">'+sList.map(function(e){return esc(e.what)}).join('、')+'</div>':'')+
    '<div class="summary-line"><span>💧 喝水</span><span>'+waterOf(d)+' / '+DB.settings.waterGoal+' ml</span></div>'+
    '<div class="summary-line"><span>😴 睡眠</span><span>'+(sl.h!=null?sl.h+'小时 · '+(sl.q||''):'—')+'</span></div>'+
    '<div class="summary-line"><span>心情</span><span style="font-size:1.1rem">'+mood+'</span></div>'+
    '<div class="summary-line"><span>🛍️ 不消费</span><span>'+nsSummary([d])+'</span></div>'+
    '</div>';
  html+='<div class="card"><div class="h2">🙏 今天做得好的3件事（感恩日记）</div>';
  for(var i=0;i<3;i++){
    html+='<input class="input" style="margin-bottom:8px" placeholder="第'+(i+1)+'件…" value="'+esc(r.good[i]||'')+'" onchange="Review.setD(\''+d+'\',\'good\',this.value,'+i+')">';
  }
  html+='</div>';
  html+='<div class="card"><div class="h2">💖 今天最满意的一件事</div><textarea class="ta" onchange="Review.setD(\''+d+'\',\'best\',this.value)">'+esc(r.best)+'</textarea></div>';
  html+='<div class="card"><div class="h2">🔮 显化练习记录</div><div class="muted" style="margin-bottom:6px">我想象了什么画面？感觉如何？</div><textarea class="ta" onchange="Review.setD(\''+d+'\',\'manifest\',this.value)">'+esc(r.manifest)+'</textarea></div>';
  html+='<div class="card"><div class="h2">🌅 明天的意图设定</div><div class="muted" style="margin-bottom:6px">明天最想完成的一件事</div><input class="input" value="'+esc(r.intention)+'" onchange="Review.setD(\''+d+'\',\'intention\',this.value)">'+
    '<label class="fl">明天的重要安排（如：下午3点给小王补课）</label><input class="input" value="'+esc(r.tomorrow)+'" onchange="Review.setD(\''+d+'\',\'tomorrow\',this.value)">'+
    (r.tomorrow?'<button class="btn btn-full mt8" onclick="Review.toPlan(\''+d+'\')">→ 一键加入明天的计划</button>':'')+'</div>';
  html+='<div class="belief"><div class="bt">✨ 睡前对自己说 ✨</div>'+esc(DB.settings.belief)+'<br><span style="font-size:.78rem;opacity:.75">今天的你已经做得很好了，晚安 🌙</span></div>';
  return html;
};
Review.setD=function(d,k,v,i){
  var r=rvD(d);
  if(k==='good')r.good[i]=v;else r[k]=v;
  save();toast('已保存 ✓');
};
Review.setMood=function(d,e){
  if(DB.mood[d]===e)delete DB.mood[d];
  else DB.mood[d]=e;
  if(!DB.emotion[d])DB.emotion[d]={};
  DB.emotion[d].mood=MOOD_TO_EMO[e]||e;
  save();rerender();
};
Review.toPlan=function(d){
  var r=rvD(d),tm=addD(d,1);
  if(!DB.plans.extra[tm])DB.plans.extra[tm]=[];
  DB.plans.extra[tm].push({id:uid(),t:'09:00',n:r.tomorrow,pri:'高'});
  save();toast('已加入 '+dispD(tm)+' 的计划（可去计划页改时间）');
};

/* ---- 每周复盘 ---- */
Review.weekHTML=function(){
  var ws=weekStart(Review.wDate),days=weekDays(ws),passed=days.filter(function(d){return d<=TODAY()});
  var r=rvW(ws);
  var goals=DB.goalsW[ws]||[],gDone=goals.filter(function(g){return g.done}).length;
  var inc=0,exp=0;days.forEach(function(d){var m=dayMoney(d);inc+=m.inc;exp+=m.exp});
  var by={coach:0,live:0,other:0};
  days.forEach(function(d){var l=DB.money.log[d];if(l&&l.inc)INC_KEYS.forEach(function(k){by[k[0]]+=+l.inc[k[0]]||0})});
  var sMin=studyMins(days);
  var byCat={};days.forEach(function(d){studyOf(d).forEach(function(e){byCat[e.cat]=(byCat[e.cat]||0)+(+e.min||0)})});
  var moods=days.map(function(d){return DB.mood[d]||'⬜'}).join(' ');
  var slps=passed.map(function(d){return sleepOf(d).h}).filter(function(h){return h!=null});
  var avgSleep=slps.length?Math.round(sum(slps)/slps.length*10)/10:null;
  var wta=timeAgg(days);
  var html='<div class="datebar"><button onclick="Review.wDate=addD(Review.wDate,-7);rerender()">‹</button><b>'+dispD(ws)+' 这一周</b><button onclick="Review.wDate=addD(Review.wDate,7);rerender()">›</button></div>';
  html+='<div class="card pinkbg"><div class="h2">📋 本周自动汇总</div>'+
    '<div class="summary-line"><span>🎯 周目标完成</span><span>'+gDone+' / '+goals.length+'</span></div>'+
    '<div class="summary-line"><span>💰 总收入 / 总支出</span><span><span class="red">+'+fm(inc)+'</span> / −'+fm(exp)+'</span></div>'+
    '<div class="summary-line"><span>结余</span><span>'+fm(inc-exp)+' 元</span></div>'+
    '<div class="summary-line"><span>📖 学习总时长</span><span>'+(sMin?fmtMin(sMin):'—')+'</span></div>'+
    '<div class="summary-line"><span>🛍️ 不消费</span><span>'+nsSummary(days)+'</span></div>'+
    '<div class="summary-line"><span>😴 平均睡眠</span><span>'+(avgSleep!=null?avgSleep+' 小时':'—')+'</span></div>'+
    '<div class="mt8"><div class="muted">本周心情走势</div><div style="font-size:1.3rem;letter-spacing:4px;margin-top:4px">'+moods+'</div></div>'+
    (wta.total?'<div class="summary-line mt8"><span>⏱️ 本周时间</span><span>'+wta.total.toFixed(1)+' 小时</span></div><div class="muted">工作 '+wta.g.work.toFixed(1)+'h · 生活 '+wta.g.life.toFixed(1)+'h · 成长 '+wta.g.growth.toFixed(1)+'h · 休闲 '+wta.g.leisure.toFixed(1)+'h（日均 '+(wta.total/passed.length).toFixed(1)+'h）</div>':'')+
    '</div>';
  // 收入线占比
  if(inc>0)html+='<div class="card"><div class="h2">🥧 本周收入线占比</div>'+donutChart(INC_KEYS.map(function(k){return {l:k[1],v:by[k[0]]}}))+'</div>';
  if(sMin>0)html+='<div class="card"><div class="h2">📖 本周学习分类（分钟）</div>'+donutChart(Object.keys(byCat).map(function(c){return {l:c,v:byCat[c]}}))+'</div>';
  // 习惯完成天数
  html+='<div class="card"><div class="h2">✅ 本周习惯完成情况</div>';
  DB.habits.forEach(function(h){
    var n=passed.filter(function(d){return habitDone(h,hrec(d,h.id))}).length;
    html+='<div class="summary-line"><span>'+h.emoji+' '+esc(h.name)+'</span><span>'+n+' / '+passed.length+' 天</span></div>';
  });
  html+='</div>';
  // 手动填写
  html+='<div class="card"><div class="h2">💖 本周做得好的3件事</div>';

<script>
'use strict';
/* ================= 时间管理 ================= */
var Time={date:TODAY(),tab:'rec'};
/* 四大类（顺序对应颜色） */
var GROUP=[
  {k:'work',   label:'💼 工作', emoji:'💼', color:'#F5A8BC'},
  {k:'life',   label:'🏠 生活', emoji:'🏠', color:'#B79CE0'},
  {k:'growth', label:'🌱 成长', emoji:'🌱', color:'#8FCBB4'},
  {k:'leisure',label:'🎮 休闲', emoji:'🎮', color:'#F2C879'}
];
var TIME_SEED={
  work:['健身教练','直播','其他工作'],
  life:['吃饭','通勤','收拾自己'],
  growth:['学习','运动健身','内容创作'],
  leisure:['娱乐','社交','玩游戏']
};

function tlog(date){if(!DB.time.log[date])DB.time.log[date]=[];return DB.time.log[date]}
function timeEntries(date){return DB.time.log[date]||[]}
function timeStudyMins(date){
  var t=0;
  (DB.time.log[date]||[]).forEach(function(e){
    if(e.group==='growth'&&/学习/.test(e.cat||''))t+=(+e.hrs||0);
  });
  return Math.round(t*60);
}
function fmtHrs(h){
  h=+h||0;
  if(h<=0)return '0';
  var whole=Math.floor(h),mins=Math.round((h-whole)*60);
  if(mins)return (whole?whole+'小时':'')+mins+'分';
  return whole+'小时';
}
/* 时长解析：6→6h；30/30m→30分；1.5→1.5h；1h30 / 1:30 → 1.5h */
function parseDur(str){
  if(str==null)return 0;
  str=String(str).trim().toLowerCase().replace(/小时|钟/g,'h').replace(/分钟/g,'m');
  if(!str)return 0;
  var colon=str.match(/^(\d+(?:\.\d+)?)\s*[:：]\s*(\d+)$/);
  if(colon)return +colon[1]+(+colon[2])/60;
  var h=str.match(/^(\d+(?:\.\d+)?)\s*h\s*(\d+)?\s*m?$/);if(h)return +h[1]+(h[2]?+h[2]/60:0);
  var m=str.match(/^(\d+(?:\.\d+)?)\s*m$/);if(m)return +m[1]/60;
  var num=parseFloat(str);
  if(isNaN(num))return 0;
  if(/^\d+$/.test(str))return num<=12?num:num/60; /* 整数≤12记为小时，>12记为分钟 */
  return num; /* 小数→小时 */
}

/* 自定义 4 段堆叠柱状图 */
Time.stacked=function(items){
  var H=170,padB=24,padT=14;
  var max=1;items.forEach(function(it){max=Math.max(max,sum(it.segs.map(function(s){return s.v})))});
  var n=items.length,slot=Math.max(30,230/n),W=Math.max(300,n*slot+20);
  var s='<div class="chart-wrap"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  var every=n>14?Math.ceil(n/10):1;
  items.forEach(function(it,i){
    var x0=10+i*slot+slot/2,y=H-padB;
    it.segs.forEach(function(ss){
      var h=ss.v/max*(H-padB-padT);
      if(h>0.5)s+='<rect x="'+(x0-9)+'" y="'+(y-h)+'" width="18" height="'+Math.max(h,1.5)+'" rx="2" fill="'+ss.color+'"/>';
      y-=h;
    });
    if(i%every===0)s+='<text x="'+x0+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#A8949E">'+esc(it.l)+'</text>';
  });
  s+='</svg></div><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:.72rem;margin-top:4px">'+GROUP.map(function(gp){
    return '<span style="display:flex;align-items:center;gap:4px"><i style="width:10px;height:10px;border-radius:3px;background:'+gp.color+';display:inline-block"></i>'+gp.label.replace(/^[^ ]+ /,'')+'</span>';
  }).join('')+'</div>';
  return s;
};
