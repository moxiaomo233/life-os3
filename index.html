Time.openForm=function(id){
  var date=Time.date;
  var rec=id?timeEntries(date).filter(function(e){return e.id===id})[0]:null;
  var g=rec?rec.group:'work';
  var cat=rec?rec.cat:'';
  var hrs=rec?rec.hrs:'';
  var note=rec?rec.note:'';
  var seedHtml='';
  GROUP.forEach(function(gp){
    TIME_SEED[gp.k].forEach(function(c){
      seedHtml+='<button class="chip" onclick="Time.fillCat(\''+c+'\')">'+c+'</button>';
    });
  });
  var qsel=[15,30,45,60,90,120,180].map(function(m){
    return '<button class="chip pink" onclick="Time.fillDur('+m+')">'+(m<60?m+'分':(m/60)+'小时')+'</button>';
  }).join('');
  var html='<div class="modal-h">'+(rec?'编辑记录':'新增时间记录')+'</div>'+
    '<label class="fl">所属大类</label><div id="tGroupRow">'+GROUP.map(function(gp){
      return '<button class="chip'+(gp.k===g?' on':'')+'" data-group="'+gp.k+'" onclick="Time.pickGroup(this)">'+gp.label+'</button>';
    }).join('')+'</div>'+
    '<label class="fl">活动名称</label><input class="input" id="tCat" placeholder="如：健身教练" value="'+esc(cat)+'">'+
    '<div style="margin:6px 0">'+seedHtml+'</div>'+
    '<label class="fl">时长</label><div style="margin:4px 0">'+qsel+'</div>'+
    '<input class="input" id="tDur" placeholder="如：2 / 90m / 1.5" value="'+(hrs!==''?hrs:'')+'" oninput="Time.durHint()">'+
    '<div class="muted mt8" id="tDurHint"></div>'+
    '<label class="fl">备注（选填）</label><input class="input" id="tNote" placeholder="如：录了塔罗新课" value="'+esc(note)+'">'+
    '<div class="row" style="margin-top:12px"><button class="btn btn-p grow" onclick="Time.save(\''+(id||'')+'\')">保存</button><button class="btn" onclick="closeModal()">取消</button></div>';
  modal(html);
  if(hrs!=='')Time.durHint();
};
Time.pickGroup=function(el){document.querySelectorAll('#tGroupRow .chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on')};
Time.fillCat=function(c){var e=$('#tCat');if(e)e.value=c};
Time.fillDur=function(m){var e=$('#tDur');if(e){e.value=m;Time.durHint()}};
Time.durHint=function(){
  var e=$('#tDur'),h=e?parseDur(e.value):0,n=$('#tDurHint');if(!n)return;
  if(!e||!e.value){n.textContent='';return;}
  n.textContent='≈ '+fmtHrs(h)+'（'+Math.round(h*60)+' 分钟）';
};
Time.save=function(id){
  var date=Time.date;
  var cat=$('#tCat').value.trim();
  if(cat==='睡觉'){toast('😴 睡觉由「身体管理」自动同步，去那里记录即可');return;}
  if(!cat){toast('填一下活动名称吧');return;}
  var grp=(document.querySelector('#tGroupRow .chip.on')||{}).dataset;grp=grp?grp.group:'work';
  var h=parseDur($('#tDur').value);
  if(h<=0){toast('填一下时长哦（如 2 / 90m / 1.5）');return;}
  if(!DB.time.log[date])DB.time.log[date]=[];
  var arr=DB.time.log[date];
  if(id){
    var r=arr.filter(function(e){return e.id===id})[0];
    if(r){r.cat=cat;r.group=grp;r.hrs=h;r.note=$('#tNote').value.trim();}
  }else{
    arr.push({id:uid(),cat:cat,group:grp,hrs:h,note:$('#tNote').value.trim()});
  }
  save();closeModal();rerender();toast('⏱️ 已记录');
};
Time.del=function(id){
  DB.time.log[Time.date]=timeEntries(Time.date).filter(function(e){return e.id!==id});
  save();rerender();toast('已删除');
};
/* 一站式页面：按分类快速设定某天时长（分钟）→ 写入时间管理 */
Time.quickSet=function(date,cat,group,minutes){
  minutes=+minutes||0;
  if(!DB.time.log[date])DB.time.log[date]=[];
  DB.time.log[date]=DB.time.log[date].filter(function(e){return e.cat!==cat});
  if(minutes>0)DB.time.log[date].push({id:uid(),cat:cat,group:group,hrs:minutes/60,note:''});
  save();rerender();toast('⏱️ '+cat+' 已记录 '+minutes+' 分钟');
};

</script>
<script>
'use strict';
/* ================= 成长显化模块 ================= */
var Growth={tab:'vision'};
var EMOWORDS=[{e:'😊',t:'开心'},{e:'🥰',t:'喜悦'},{e:'😌',t:'平静'},{e:'🔥',t:'兴奋'},{e:'😟',t:'焦虑'},{e:'😩',t:'疲惫'},{e:'🎯',t:'专注'},{e:'😢',t:'低落'}];

VIEWS.growth=function(){
  var tabs=[['vision','🌟 愿景板'],['aware','💡 灵感觉察'],['emotion','💗 情绪能量'],['achieve','🏆 成就墙'],['gratitude','🙏 感恩'],['report','🌈 周报']];
  var html='<div class="subtabs" style="flex-wrap:wrap">';
  tabs.forEach(function(t){html+='<button class="'+(Growth.tab===t[0]?'on':'')+'" onclick="Growth.tab=\''+t[0]+'\';'+(t[0]==='emotion'?'Growth.emoDate=TODAY();':'')+'rerender()">'+t[1]+'</button>'});
  html+='</div>';
  var f={'vision':Growth.visionHTML,'aware':Growth.awareHTML,'emotion':Growth.emotionHTML,'achieve':Growth.achieveHTML,'gratitude':Growth.gratitudeHTML,'report':Growth.reportHTML}[Growth.tab];
  html+=f();
  $('#view').innerHTML=html;
};

/* ---- 灵感觉察（合并 灵感+奇迹+学员） ---- */
Growth.awareHTML=function(){
  return Growth.miracleHTML()+Growth.inspireHTML()+Growth.studentHTML();
};

/* ---- 愿景板 ---- */
Growth.visionHTML=function(){
  var html='<div class="card pinkbg"><div class="h2">🌟 我的愿景板</div><div class="muted">把理想生活的画面写下来，每天看一眼，强化「我已经拥有」的频率。</div></div>';
  html+='<div class="vision-grid">';
  DB.vision.forEach(function(v,i){
    html+='<div class="vision-card"><div class="v-emoji">'+esc(v.emoji||'🌟')+'</div><div class="v-text">'+esc(v.text)+'</div><button class="del-x" onclick="Growth.delVision('+i+')">✕</button></div>';
  });
  html+='</div>';
  html+='<button class="btn btn-p btn-full mt12" onclick="Growth.addVision()">＋ 添加愿景</button>';
  return html;
};
Growth.addVision=function(){
  var emoji=prompt('选个图标emoji（可留空）：','🌟')||'🌟';
  var text=prompt('写下一句你的理想生活：');
  if(!text)return;
  DB.vision.push({id:uid(),emoji:emoji,text:text});
  save();rerender();toast('🌟 已加入愿景板');
};
Growth.delVision=function(i){DB.vision.splice(i,1);save();rerender()};

/* ---- 奇迹日志 ---- */
Growth.miracleHTML=function(){
  var html='<div class="card"><div class="h2">✨ 奇迹日志</div><div class="muted">记下宇宙回应你的小信号——意外之财、学员续课、被人夸……培养对丰盛的觉察。</div>'+
    '<div class="row" style="margin:8px 0"><input class="input grow" id="mirTxt" placeholder="今天宇宙给了我什么小信号？"><button class="btn btn-p" onclick="Growth.addMiracle()">记录</button></div></div>';
  html+='<div class="card"><div class="h2">📜 我的奇迹记录</div>';
  var keys=Object.keys(DB.miracle).sort().reverse();
  if(!keys.length)html+='<div class="empty">还没有记录，今天留意一下 ✨</div>';
  keys.forEach(function(k){
    DB.miracle[k].forEach(function(t,i){
      html+='<div class="li"><div class="emoji">✨</div><div class="grow"><div class="name">'+esc(t)+'</div><div class="desc muted">'+dispD(k)+'</div></div><button class="del-x" onclick="Growth.delMiracle(\''+k+'\','+i+')">✕</button></div>';
    });
  });
  html+='</div>';
  return html;
};
Growth.addMiracle=function(){
  var t=$('#mirTxt').value.trim();if(!t){toast('写点什么吧');return}
  var d=TODAY();if(!DB.miracle[d])DB.miracle[d]=[];
  DB.miracle[d].push(t);save();rerender();toast('✨ 已记下，丰盛正在被你看见');
};
Growth.delMiracle=function(k,i){DB.miracle[k].splice(i,1);if(!DB.miracle[k].length)delete DB.miracle[k];save();rerender()};

/* ---- 情绪能量日记 ---- */
Growth.emotionHTML=function(){
  var ed=Growth.emoDate||TODAY(), r=DB.emotion[ed]||{}, isToday=(ed===TODAY());
  var html='<div class="card"><div class="h2">💗 情绪能量日记</div>'+
    '<div class="row" style="margin:4px 0 10px"><label class="fl" style="margin:0 8px 0 0">日期</label>'+
    '<input class="input" id="emDate" type="date" value="'+ed+'" max="'+TODAY()+'" onchange="Growth.setEmoDate(this.value)"></div>'+
    '<label class="fl">此刻的情绪</label><div id="emRow" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
  EMOWORDS.forEach(function(w){html+='<button class="chip'+(r.mood===w.e?' on':'')+'" data-e="'+w.e+'" onclick="Growth.pickEmo(this)">'+w.e+' '+w.t+'</button>'});
  html+='</div>'+
    '<label class="fl">能量值（1-10）</label><input class="input" id="emEnergy" type="number" min="1" max="10" value="'+(r.energy||'')+'" placeholder="状态几分？">'+
    '<label class="fl">触发事件（一句话，选填）</label><input class="input" id="emTrig" placeholder="如：学员说跟我练有变化" value="'+esc(r.trig||'')+'">'+
    '<button class="btn btn-p btn-full mt12" onclick="Growth.saveEmo()">保存'+(isToday?'今日':'当日')+'情绪能量</button>'+
    (isToday?'':'<div class="muted mt8">补记过往日期也可以哦，数据会落到对应那一天 ♡</div>')+'</div>';
  html+='<div class="card"><div class="h2">📈 近14天能量走势</div>';
  var items=[];for(var i=13;i>=0;i--){var dd=addD(TODAY(),-i);var e=(DB.emotion[dd]||{}).energy;items.push({l:(P(dd).getMonth()+1)+'/'+P(dd).getDate(),v:e||null})}
  html+=lineChart(items,{c:'#F5A8BC'})+'</div>';
  return html;
};
Growth.setEmoDate=function(v){ if(v)Growth.emoDate=v; rerender(); };
Growth.pickEmo=function(el){document.querySelectorAll('#emRow .chip').forEach(function(c){c.classList.remove('on')});el.classList.add('on')};
Growth.saveEmo=function(){
  var d=Growth.emoDate||TODAY();var mEl=document.querySelector('#emRow .chip.on');var mood=mEl?mEl.dataset.e:'';
  var en=parseInt($('#emEnergy').value);if(!en||en<1||en>10){toast('填一下能量值(1-10)');return}
  DB.emotion[d]={mood:mood,energy:en,trig:$('#emTrig').value.trim()};
  if(mood)DB.mood[d]=EMO_TO_MOOD[mood]||mood;
  save();rerender();
  toast(d===TODAY()?'💗 已记录，看见自己的情绪很棒':'💗 已补记 '+dispD(d)+' 的情绪');
};

/* ---- 成就墙 ---- */
Growth.achieveHTML=function(){
  var html='<div class="card pinkbg"><div class="h2">🏆 我的成就墙</div><div class="muted">记录大事件——首次月入过万、连续打卡100天、第一个私教毕业……可视化成就感，对抗拖延。</div></div>';
  html+='<div class="ach-grid">';
  DB.achieve.slice().reverse().forEach(function(a){
    html+='<div class="ach-card"><div class="a-date">'+dispD(a.date)+'</div><div class="a-text">'+esc(a.text)+'</div></div>';
  });
  html+='</div>';
  html+='<button class="btn btn-p btn-full mt12" onclick="Growth.addAchieve()">＋ 记录成就</button>';
  return html;
};
Growth.addAchieve=function(){
  var text=prompt('记下一件值得骄傲的事：');if(!text)return;
  DB.achieve.push({id:uid(),date:TODAY(),text:text});save();rerender();toast('🏆 记下了，你超棒的！');
};

/* ---- 感恩 ---- */
function hasGratitude(dd){
  if(DB.gratitude[dd]&&DB.gratitude[dd].length)return DB.gratitude[dd].length;
  var g=DB.review.d[dd]&&DB.review.d[dd].good;
  if(g&&g.some(function(x){return x&&x.trim()}))return 1;
  return 0;
}
Growth.gratitudeHTML=function(){
  var html='<div class="card"><div class="h2">🙏 今日感恩</div><div class="muted">把值得感谢的事写下来，训练看见丰盛的眼睛。</div>'+
    '<div class="row" style="margin:8px 0"><input class="input grow" id="grTxt" placeholder="今天感恩的一件事…"><button class="btn btn-p" onclick="Growth.addGratitude()">记录</button></div></div>';
  html+='<div class="card"><div class="h2">🔥 感恩热力图 <span class="sub">最近15周</span></div>';
  var hDays=[],start=addD(TODAY(),-104);
  for(var d2=start;d2<=TODAY();d2=addD(d2,1)){var lv=hasGratitude(d2);hDays.push({date:d2,lvl:lv?Math.min(4,lv):0})}
  html+=heatmap(hDays)+'</div>';
  html+='<div class="card"><div class="h2">📜 最近感恩</div>';
  var keys=Object.keys(DB.gratitude).sort().reverse();
  if(!keys.length)html+='<div class="empty">还没有独立感恩记录（复盘里的「3件好事」也会点亮哦）</div>';
  keys.forEach(function(k){DB.gratitude[k].forEach(function(t,i){
    html+='<div class="li"><div class="emoji">🙏</div><div class="grow"><div class="name">'+esc(t)+'</div><div class="desc muted">'+dispD(k)+'</div></div><button class="del-x" onclick="Growth.delGratitude(\''+k+'\','+i+')">✕</button></div>';
  })});
  html+='</div>';
  return html;
};
Growth.addGratitude=function(){
  var t=$('#grTxt').value.trim();if(!t){toast('写点什么吧');return}
  var d=TODAY();if(!DB.gratitude[d])DB.gratitude[d]=[];
  DB.gratitude[d].push(t);save();rerender();toast('🙏 感恩，丰盛会流向你');
};
Growth.delGratitude=function(k,i){DB.gratitude[k].splice(i,1);if(!DB.gratitude[k].length)delete DB.gratitude[k];save();rerender()};

/* ---- 灵感本 ---- */
Growth.inspireHTML=function(){
  var html='<div class="card"><div class="h2">💡 灵感本</div><div class="muted">随时记灵感、想学的、想做的，不打断流。</div>'+
    '<div class="row" style="margin:8px 0"><input class="input grow" id="insTxt" placeholder="闪过的灵感…"><button class="btn btn-p" onclick="Growth.addInspire()">记</button></div></div>';
  html+='<div class="card"><div class="h2">📜 我的灵感</div>';
  var list=DB.inspire.slice().reverse();
  if(!list.length)html+='<div class="empty">还没有灵感记录</div>';
  list.forEach(function(it){
    html+='<div class="li"><div class="emoji">💡</div><div class="grow"><div class="name">'+esc(it.note)+'</div><div class="desc muted">'+dispD(it.date)+'</div></div><button class="del-x" onclick="Growth.delInspire(\''+it.id+'\')">✕</button></div>';
  });
  html+='</div>';
  return html;
};
Growth.addInspire=function(){
  var t=$('#insTxt').value.trim();if(!t){toast('写点什么吧');return}
  DB.inspire.push({id:uid(),date:TODAY(),note:t});save();rerender();toast('💡 记下了');
};
Growth.delInspire=function(id){DB.inspire=DB.inspire.filter(function(x){return x.id!==id});save();rerender()};

/* ---- 学员成长 ---- */
Growth.studentHTML=function(){
  var html='<div class="card pinkbg"><div class="h2">🌱 学员成长记录</div><div class="muted">记下学员因你改变的故事，强化「我是稀缺、有价值」的身份，也是内容素材。</div></div>';
  html+='<div class="card"><div class="row"><input class="input grow" id="stuName" placeholder="学员名字"><input class="input grow" id="stuStory" placeholder="他的变化/故事" style="margin-left:6px"></div>'+
    '<button class="btn btn-p btn-full mt8" onclick="Growth.addStudent()">＋ 记录</button></div>';
  html+='<div class="card"><div class="h2">📜 学员故事</div>';
  var list=DB.student.slice().reverse();
  if(!list.length)html+='<div class="empty">还没有记录</div>';
  list.forEach(function(it){
    html+='<div class="li"><div class="emoji" style="background:#B79CE033">🌱</div><div class="grow"><div class="name">'+esc(it.name)+' <span class="muted">'+dispD(it.date)+'</span></div><div class="desc">'+esc(it.story)+'</div></div><button class="del-x" onclick="Growth.delStudent(\''+it.id+'\')">✕</button></div>';
  });
  html+='</div>';
  return html;
};
Growth.addStudent=function(){
  var n=$('#stuName').value.trim(),s=$('#stuStory').value.trim();
  if(!n&&!s){toast('填点什么吧');return}
  DB.student.push({id:uid(),date:TODAY(),name:n,story:s});save();rerender();toast('🌱 已记录，你的价值被看见');
};
Growth.delStudent=function(id){DB.student=DB.student.filter(function(x){return x.id!==id});save();rerender()};

/* ---- 温柔周报 ---- */
Growth.reportHTML=function(){
  var ws=weekStart(TODAY()),days=weekDays(ws),passed=days.filter(function(d){return d<=TODAY()});
  var inc=0,exp=0;days.forEach(function(d){var m=dayMoney(d);inc+=m.inc;exp+=m.exp});
  var sMin=studyMins(days);
  var t=timeAgg(days);
  var energies=passed.map(function(d){return (DB.emotion[d]||{}).energy}).filter(function(x){return x});
  var avgE=energies.length?Math.round(sum(energies)/energies.length):null;
  var ach=DB.achieve.length;
  var txt='🌈 本周温柔周报\n';
  txt+='这一周你认真生活、认真变好：收入 +'+fm(inc)+' 元，支出 '+fm(exp)+' 元；\n';
  txt+='学习投入 '+fmtMin(sMin)+'，时间花在 工作 '+t.g.work.toFixed(1)+'h、成长 '+t.g.growth.toFixed(1)+'h；\n';
  if(avgE!=null)txt+='平均能量值 '+avgE+'/10，你的状态在线 ✨\n';
  txt+='已记录 '+ach+' 个成就，显化正悄悄发生。\n';
  txt+='继续对自己温柔，你值得拥有财富自由与健康的身体 💕';
  var html='<div class="card"><div class="h2">🌈 本周温柔周报</div><div class="muted">系统自动生成的温柔小结，可直接复制发圈～</div>'+
    '<textarea class="ta" id="repTxt" style="height:170px">'+esc(txt)+'</textarea>'+
    '<button class="btn btn-p btn-full mt12" onclick="Growth.copyReport()">📋 复制周报</button></div>';
  return html;
};
Growth.copyReport=function(){
  var t=$('#repTxt');
  if(t){t.select();try{document.execCommand('copy')}catch(e){}}
  toast('📋 已复制，去发圈吧～');
};

</script>
<script>boot();</script>
</body>
